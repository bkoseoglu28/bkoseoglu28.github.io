<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Advanced Shooter Velocity Analyzer</title>
<script async src="https://docs.opencv.org/4.x/opencv.js"></script>
<style>
body { background:#111; color:white; font-family:Arial; text-align:center; }
canvas { border:2px solid white; margin-top:10px; }
input { margin:5px; padding:5px; }
button { padding:8px 15px; margin:5px; }
</style>
</head>
<body>

<h2>FRC Shooter Velocity + RPM Analyzer</h2>

<input type="file" id="videoInput" accept="video/*"><br>

<label>Referans Çubuk Uzunluğu (m):</label>
<input type="number" id="realLength" step="0.01"><br>

<label>Fırlatma Açısı (deg):</label>
<input type="number" id="angle"><br>

<label>Tekerlek Çapı (m):</label>
<input type="number" id="wheelDiameter" step="0.001"><br>

<label>Tekerlek RPM:</label>
<input type="number" id="rpm"><br>

<button onclick="captureFrame()">Frame Yakala</button>
<button onclick="startTracking()">Analizi Başlat</button>

<br>
<video id="video" width="640" controls></video>
<br>
<canvas id="canvas" width="640" height="480"></canvas>

<h3 id="result"></h3>

<script>
let video = document.getElementById('video');
let canvas = document.getElementById('canvas');
let ctx = canvas.getContext('2d');

let calibrationPoints = [];
let pixelToMeter = 0;
let trajectory = [];

document.getElementById('videoInput').addEventListener('change', function(e){
    let file = e.target.files[0];
    video.src = URL.createObjectURL(file);
});

canvas.addEventListener('click', function(e){
    if(calibrationPoints.length >= 2) return;

    let rect = canvas.getBoundingClientRect();
    let x = e.clientX - rect.left;
    let y = e.clientY - rect.top;

    calibrationPoints.push({x:x,y:y});
    ctx.fillStyle="red";
    ctx.beginPath();
    ctx.arc(x,y,5,0,2*Math.PI);
    ctx.fill();

    if(calibrationPoints.length==2){
        let dx = calibrationPoints[1].x - calibrationPoints[0].x;
        let dy = calibrationPoints[1].y - calibrationPoints[0].y;
        let pixelLength = Math.sqrt(dx*dx+dy*dy);

        let realLength = parseFloat(document.getElementById("realLength").value);
        pixelToMeter = realLength / pixelLength;
        alert("Kalibrasyon tamamlandı.");
    }
});

function startTracking(){
    let cap = new cv.VideoCapture(video);
    let frame = new cv.Mat(video.height, video.width, cv.CV_8UC4);
    let hsv = new cv.Mat();
    let mask = new cv.Mat();
    let lower = new cv.Mat(hsv.rows, hsv.cols, hsv.type(), [20,100,100,0]);
    let upper = new cv.Mat(hsv.rows, hsv.cols, hsv.type(), [35,255,255,255]);

    trajectory = [];

    function process(){
        cap.read(frame);
        cv.cvtColor(frame, hsv, cv.COLOR_RGBA2RGB);
        cv.cvtColor(hsv, hsv, cv.COLOR_RGB2HSV);
        cv.inRange(hsv, lower, upper, mask);

        let contours = new cv.MatVector();
        let hierarchy = new cv.Mat();
        cv.findContours(mask, contours, hierarchy, cv.RETR_EXTERNAL, cv.CHAIN_APPROX_SIMPLE);

        if(contours.size() > 0){
            let cnt = contours.get(0);
            let moments = cv.moments(cnt);

            if(moments.m00 != 0){
                let cx = moments.m10/moments.m00;
                let cy = moments.m01/moments.m00;

                trajectory.push({
                    x: cx * pixelToMeter,
                    y: cy * pixelToMeter,
                    t: video.currentTime
                });

                ctx.drawImage(video,0,0,canvas.width,canvas.height);
                ctx.fillStyle="lime";
                ctx.beginPath();
                ctx.arc(cx,cy,6,0,2*Math.PI);
                ctx.fill();
            }
        }

        requestAnimationFrame(process);
    }

    process();
}

function analyzePhysics(){

    if(trajectory.length < 5){
        alert("Yeterli veri yok.");
        return;
    }

    let t = [];
    let y = [];

    let t0 = trajectory[0].t;

    for(let i=0;i<trajectory.length;i++){
        t.push(trajectory[i].t - t0);
        y.push(trajectory[i].y);
    }

    // Quadratic fit: y = at² + bt + c
    let sumT=0,sumT2=0,sumT3=0,sumT4=0,sumY=0,sumTY=0,sumT2Y=0;
    let n = t.length;

    for(let i=0;i<n;i++){
        let ti = t[i];
        let yi = y[i];
        sumT += ti;
        sumT2 += ti*ti;
        sumT3 += ti*ti*ti;
        sumT4 += ti*ti*ti*ti;
        sumY += yi;
        sumTY += ti*yi;
        sumT2Y += ti*ti*yi;
    }

    let denom = (n*sumT2*sumT4 + 2*sumT*sumT2*sumT3 - sumT2*sumT2*sumT2 - n*sumT3*sumT3 - sumT*sumT*sumT4);

    let a = (n*sumT2*sumT2Y + sumT*sumT3*sumY + sumT2*sumT*sumTY - sumT2*sumT2*sumY - n*sumT3*sumTY - sumT*sumT*sumT2Y) / denom;

    let g_effective = -2*a;

    let magnus = 9.81 - g_effective;

    document.getElementById("result").innerHTML =
        "Effective g: " + g_effective.toFixed(2) + " m/s²<br>" +
        "Gerçek g: 9.81 m/s²<br>" +
        "Magnus İvmesi: " + magnus.toFixed(2) + " m/s²<br>" +
        (g_effective < 9.5 ? "Backspin var 🌀" : "Backspin yok");
}
</script>

</body>
</html>
