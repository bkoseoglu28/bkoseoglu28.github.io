<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Robot Shot Analyzer</title>
<style>
body { background:#111; color:white; font-family:Arial; text-align:center; }
.container{
  display:flex;
  justify-content:center;
  gap:20px;
  flex-wrap:wrap;
}
video, canvas{
  max-width:45vw;
  height:auto;
  border:1px solid white;
}
input{ width:70px; }
button{ margin:4px; padding:5px 10px; }
</style>
</head>
<body>

<h2>Robot Shot Analyzer</h2>

<input type="file" id="videoUpload" accept="video/*"><br><br>

Rod Length (m): <input type="number" id="rodLength" step="0.01" value="0.5">
Angle (deg): <input type="number" id="angle" step="1" value="45">
Wheel RPM: <input type="number" id="rpm" step="10" value="3000"><br><br>

<button onclick="grabFrame()">Select Frame</button>
<button onclick="calibrate()">Calibrate Rod</button>
<button onclick="toggleHSV()">HSV Pick</button>
<button onclick="toggleTracking()">Start / Stop Tracking</button>

<br><br>

<div class="container">
  <video id="video" controls></video>
  <canvas id="canvas"></canvas>
</div>

<h3 id="results"></h3>

<script>
const video=document.getElementById("video");
const canvas=document.getElementById("canvas");
const ctx=canvas.getContext("2d");

let scale=1;
let tracking=false;
let lastPos=null;
let lastTime=null;

let hsv={hMin:20,hMax:40,sMin:120,vMin:120};

let launchSpeed=0;
let capturing=false;
let captureFrames=[];
let locked=false;

document.getElementById("videoUpload").onchange=e=>{
  video.src=URL.createObjectURL(e.target.files[0]);
};

video.onloadedmetadata=()=>{
  canvas.width=video.videoWidth;
  canvas.height=video.videoHeight;
};

function getMousePos(evt){
  const rect = canvas.getBoundingClientRect();
  const scaleX = canvas.width / rect.width;
  const scaleY = canvas.height / rect.height;
  return {
    x: (evt.clientX - rect.left) * scaleX,
    y: (evt.clientY - rect.top) * scaleY
  };
}

function grabFrame(){
  video.pause();
  ctx.drawImage(video,0,0,canvas.width,canvas.height);
}

function calibrate(){
  let points=[];
  alert("Çubuğun iki ucuna tıkla");

  canvas.onclick=e=>{
    const pos=getMousePos(e);
    points.push(pos);

    ctx.drawImage(video,0,0,canvas.width,canvas.height);
    ctx.fillStyle="red";
    ctx.beginPath();
    ctx.arc(pos.x,pos.y,8,0,Math.PI*2);
    ctx.fill();

    if(points.length==2){
      ctx.strokeStyle="red";
      ctx.lineWidth=4;
      ctx.beginPath();
      ctx.moveTo(points[0].x,points[0].y);
      ctx.lineTo(points[1].x,points[1].y);
      ctx.stroke();

      let rod=parseFloat(document.getElementById("rodLength").value);
      let dx=points[1].x-points[0].x;
      let dy=points[1].y-points[0].y;
      let pixelDist=Math.sqrt(dx*dx+dy*dy);
      scale=rod/pixelDist;

      canvas.onclick=null;
      alert("Kalibrasyon tamam ✅");
    }
  };
}

function toggleHSV(){
  alert("Topun ortasına tıkla");
  canvas.onclick=e=>{
    const pos=getMousePos(e);
    let data=ctx.getImageData(pos.x,pos.y,1,1).data;
    let hsvVal=rgbToHsv(data[0],data[1],data[2]);

    let h=hsvVal[0];
    hsv.hMin=(h-8+360)%360;
    hsv.hMax=(h+8)%360;
    hsv.sMin=120;
    hsv.vMin=120;

    canvas.onclick=null;
    alert("HSV ayarlandı ✅");
  };
}

function toggleTracking(){
  tracking=!tracking;

  if(tracking){
    lastPos=null;
    lastTime=null;
    launchSpeed=0;
    captureFrames=[];
    capturing=false;
    locked=false;
    video.play();
    video.requestVideoFrameCallback(processFrame);
  }
}

function hueMatch(h){
  if(hsv.hMin<hsv.hMax)
    return h>=hsv.hMin && h<=hsv.hMax;
  else
    return h>=hsv.hMin || h<=hsv.hMax;
}

function processFrame(now, metadata){
  if(!tracking) return;

  ctx.drawImage(video,0,0,canvas.width,canvas.height);

  let img=ctx.getImageData(0,0,canvas.width,canvas.height);
  let data=img.data;

  let centerX=canvas.width/2;
  let centerY=canvas.height/2;

  let bestX=null;
  let bestY=null;
  let bestDist=999999;

  for(let y=0;y<canvas.height;y+=2){
    for(let x=0;x<canvas.width;x+=2){

      let i=(y*canvas.width+x)*4;
      let hsvVal=rgbToHsv(data[i],data[i+1],data[i+2]);

      if(hueMatch(hsvVal[0]) && hsvVal[1]>hsv.sMin && hsvVal[2]>hsv.vMin){

        let dist=Math.hypot(x-centerX,y-centerY);

        if(dist<bestDist){
          bestDist=dist;
          bestX=x;
          bestY=y;
        }
      }
    }
  }

  if(bestX!==null){

    if(lastPos!==null){
      let dx=(bestX-lastPos.x)*scale;
      let dy=(bestY-lastPos.y)*scale;
      let dt=metadata.mediaTime-lastTime;

      if(dt>0){

        let speed=Math.sqrt(dx*dx+dy*dy)/dt;

        if(!locked){

          if(speed>1 && !capturing){
            capturing=true;
            captureFrames=[];
          }

          if(capturing){
            captureFrames.push(speed);

            if(captureFrames.length>=6){
              launchSpeed = captureFrames.reduce((a,b)=>a+b)/captureFrames.length;
              locked=true;
              capturing=false;
            }
          }
        }
      }
    }

    lastPos={x:bestX,y:bestY};
    lastTime=metadata.mediaTime;

    ctx.strokeStyle="lime";
    ctx.lineWidth=3;
    ctx.beginPath();
    ctx.arc(bestX,bestY,14,0,Math.PI*2);
    ctx.stroke();
  }

  calculatePhysics();
  video.requestVideoFrameCallback(processFrame);
}

function calculatePhysics(){

  let measured=launchSpeed;

  let rpm=parseFloat(document.getElementById("rpm").value)||0;
  let angleDeg=parseFloat(document.getElementById("angle").value)||0;

  let wheelRadius=0.05;
  let wheelSpeed=2*Math.PI*wheelRadius*(rpm/60);
  let efficiency= wheelSpeed>0 ? (measured/wheelSpeed)*100 : 0;

  let ballRadius=0.05;
  let ballMass=0.27;
  let airDensity=1.2;

  let omega=2*Math.PI*(rpm/60);
  let spinRatio = measured>0 ? (omega*ballRadius)/measured : 0;
  let C_L = Math.min(1.6*spinRatio,1.5);

  let area = Math.PI*ballRadius*ballRadius;
  let magnusForce = 0.5*airDensity*area*measured*measured*C_L;
  let magnusAccel = ballMass>0 ? magnusForce/ballMass : 0;

  let g=9.81;
  let effectiveG=g-magnusAccel;

  document.getElementById("results").innerHTML=
  `Measured Speed: ${measured.toFixed(2)} m/s<br>
   Wheel Surface Speed: ${wheelSpeed.toFixed(2)} m/s<br>
   Efficiency: ${efficiency.toFixed(1)} %<br><br>
   Launch Angle: ${angleDeg}°<br>
   Spin Ratio: ${spinRatio.toFixed(2)}<br>
   Magnus Accel: ${magnusAccel.toFixed(2)} m/s²<br>
   Effective g: ${effectiveG.toFixed(2)} m/s²<br>
   Backspin ${magnusAccel>0.5?"Var 🌀":"Yok"}`;
}

function rgbToHsv(r,g,b){
  r/=255; g/=255; b/=255;
  let max=Math.max(r,g,b),min=Math.min(r,g,b);
  let h,s,v=max;
  let d=max-min;
  s=max==0?0:d/max;

  if(max==min){h=0;}
  else{
    switch(max){
      case r:h=(g-b)/d+(g<b?6:0);break;
      case g:h=(b-r)/d+2;break;
      case b:h=(r-g)/d+4;break;
    }
    h/=6;
  }
  return [h*360,s*255,v*255];
}
</script>

</body>
</html>
