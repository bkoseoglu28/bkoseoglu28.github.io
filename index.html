<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Robot Shot Analyzer - Manual Mask</title>
<style>
body { background:#111; color:white; font-family:Arial, sans-serif; text-align:center; }
.container{
  position: relative;
  display:inline-block;
  margin-top:10px;
}
video { display:block; max-width:80vw; height:auto; border:1px solid #555; }
canvas { position:absolute; top:0; left:0; width:100%; height:100%; cursor:crosshair; }
input{ width:70px; background:#222; color:white; border:1px solid #444; padding:5px; }
button{ 
  margin:5px; padding:8px 15px; cursor:pointer; 
  background:#333; color:white; border:1px solid #555; font-size:14px; 
}
button:hover{ background:#555; }
button.active{ background:#d63031; border-color:red; }
button.green{ background:#00b894; border:none; color:black; font-weight:bold; }

#results { 
  background:#222; padding:15px; margin-top:10px; 
  border:1px solid #444; display:inline-block; text-align:left; min-width:250px; 
}
</style>
</head>
<body>

<h2>Robot Shot Analyzer (Manuel Maskeleme)</h2>

<div style="margin-bottom:15px;">
  <input type="file" id="videoUpload" accept="video/*"><br><br>
  
  Çubuk (m): <input type="number" id="rodLength" step="0.01" value="0.5">
  Açı: <input type="number" id="angle" value="45">
  Hassasiyet: <input type="number" id="sensitivity" value="30" title="Düşük=Hassas, Yüksek=Kaba">
</div>

<div>
  <button onclick="calibrate()">1. Kalibre Et</button>
  <button onclick="toggleHSV()">2. Renk Seç</button>
  <button onclick="toggleMasking()" id="btnMask">3. Yasak Bölge Çiz</button>
  <button onclick="clearMasks()">Maskeleri Sil</button>
  <button class="green" onclick="toggleTracking()" id="btnTrack">BAŞLAT / DURDUR</button>
</div>

<div class="container">
  <video id="video" playsinline muted></video>
  <canvas id="canvas"></canvas>
</div>

<div id="results">Hazır...</div>

<script>
const video=document.getElementById("video");
const canvas=document.getElementById("canvas");
const ctx=canvas.getContext("2d", { willReadFrequently: true });

// SİSTEM DEĞİŞKENLERİ
let scale=0;
let tracking=false;
let hsv={hMin:0,hMax:0,sMin:50,vMin:50};

// MASKELEME (YASAK BÖLGELER)
let ignoreZones = []; // {x, y, w, h}
let isDrawingMask = false;
let maskStart = null;

// HAREKET ALGILAMA
let previousFrameData = null;
let lastPos=null;
let lastTime=null;
let captureFrames=[];
let capturing=false;
let locked=false;
let launchSpeed=0;

// DOSYA YÜKLEME
document.getElementById("videoUpload").onchange=e=>{
  if(e.target.files[0]){
    video.src=URL.createObjectURL(e.target.files[0]);
    resetSystem();
  }
};

video.onloadedmetadata=()=>{
  canvas.width=video.videoWidth;
  canvas.height=video.videoHeight;
  drawOverlay();
};

function resetSystem(){
  tracking=false;
  locked=false;
  launchSpeed=0;
  captureFrames=[];
  lastPos=null;
  previousFrameData=null;
  document.getElementById("results").innerHTML = "Video Yüklendi.";
  drawOverlay();
}

function getMousePos(evt){
  const rect = canvas.getBoundingClientRect();
  return {
    x: (evt.clientX - rect.left) * (canvas.width / rect.width),
    y: (evt.clientY - rect.top) * (canvas.height / rect.height)
  };
}

// --- 1. KALİBRASYON ---
function calibrate(){
  video.pause();
  let points=[];
  alert("Çubuğun iki ucuna tıkla");
  
  canvas.onmousedown = e => {
    points.push(getMousePos(e));
    drawOverlay(points); // Noktaları göster
    
    if(points.length==2){
      let rodLen = parseFloat(document.getElementById("rodLength").value);
      let dist = Math.hypot(points[1].x-points[0].x, points[1].y-points[0].y);
      if(dist>0) {
        scale = rodLen/dist;
        alert("Kalibrasyon Tamam!");
      }
      canvas.onmousedown = null;
      drawOverlay();
    }
  };
}

// --- 2. RENK SEÇİMİ ---
function toggleHSV(){
  video.pause();
  alert("Topun üzerine tıkla");
  canvas.onmousedown = e => {
    let p = getMousePos(e);
    let d = ctx.getImageData(p.x, p.y, 1, 1).data;
    let val = rgbToHsv(d[0],d[1],d[2]);
    
    hsv.hMin = (val[0]-15+360)%360;
    hsv.hMax = (val[0]+15)%360;
    hsv.sMin = Math.max(20, val[1]-60);
    hsv.vMin = Math.max(20, val[2]-60);
    
    alert("Renk Kaydedildi.");
    canvas.onmousedown = null;
  };
}

// --- 3. MASKELEME (KUTU ÇİZME) ---
function toggleMasking(){
  video.pause();
  isDrawingMask = !isDrawingMask;
  let btn = document.getElementById("btnMask");
  
  if(isDrawingMask){
    btn.classList.add("active");
    btn.innerText = "Çizimi Bitir";
    alert("Yasaklamak istediğin alanlara kutu çiz ve bırak.");
    
    canvas.onmousedown = e => { maskStart = getMousePos(e); };
    canvas.onmouseup = e => {
      if(maskStart){
        let end = getMousePos(e);
        let w = end.x - maskStart.x;
        let h = end.y - maskStart.y;
        // Ters çizimi düzelt
        if(w < 0) { maskStart.x += w; w = -w; }
        if(h < 0) { maskStart.y += h; h = -h; }
        
        if(w>5 && h>5) {
            ignoreZones.push({x: maskStart.x, y: maskStart.y, w: w, h: h});
        }
        maskStart = null;
        drawOverlay();
      }
    };
    canvas.onmousemove = e => {
        if(maskStart){
            drawOverlay(); // Mevcut kutuları çiz
            let cur = getMousePos(e);
            ctx.fillStyle = "rgba(255, 0, 0, 0.5)";
            ctx.fillRect(maskStart.x, maskStart.y, cur.x - maskStart.x, cur.y - maskStart.y);
        }
    }
  } else {
    btn.classList.remove("active");
    btn.innerText = "3. Yasak Bölge Çiz";
    canvas.onmousedown = null;
    canvas.onmouseup = null;
    canvas.onmousemove = null;
    drawOverlay();
  }
}

function clearMasks(){
    ignoreZones = [];
    drawOverlay();
}

// --- YARDIMCI: ÇİZİM ---
function drawOverlay(points=[]){
    if(tracking) return; // Takip sırasında çizme
    ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
    
    // Kalibrasyon noktaları
    ctx.fillStyle="lime";
    points.forEach(p=>{ ctx.beginPath(); ctx.arc(p.x,p.y,5,0,Math.PI*2); ctx.fill(); });
    
    // Yasak Bölgeler (Kırmızı Kutular)
    ctx.fillStyle = "rgba(255, 0, 0, 0.4)";
    ctx.strokeStyle = "red";
    ignoreZones.forEach(z => {
        ctx.fillRect(z.x, z.y, z.w, z.h);
        ctx.strokeRect(z.x, z.y, z.w, z.h);
        // Çarpı işareti
        ctx.beginPath(); ctx.moveTo(z.x, z.y); ctx.lineTo(z.x+z.w, z.y+z.h); ctx.stroke();
        ctx.beginPath(); ctx.moveTo(z.x+z.w, z.y); ctx.lineTo(z.x, z.y+z.h); ctx.stroke();
    });
}

// --- ANA TAKİP ---
function toggleTracking(){
    if(scale===0) { alert("Kalibrasyon yapmadın!"); return; }
    tracking = !tracking;
    let btn = document.getElementById("btnTrack");
    
    if(tracking){
        btn.innerText = "DURDUR";
        btn.style.background = "red";
        video.play();
        previousFrameData = null;
        video.requestVideoFrameCallback(processFrame);
    } else {
        btn.innerText = "BAŞLAT";
        btn.style.background = "#00b894";
        video.pause();
        drawOverlay();
    }
}

function processFrame(now, metadata){
    if(!tracking) return;
    
    ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
    
    // Kırmızı yasak bölgeleri çiz (görmek için)
    ctx.fillStyle = "rgba(255, 0, 0, 0.3)";
    ignoreZones.forEach(z => ctx.fillRect(z.x, z.y, z.w, z.h));

    // Arama Penceresi Optimizasyonu
    let startX=0, startY=0, w=canvas.width, h=canvas.height;
    if(lastPos && !locked){
        const win=150;
        startX=Math.max(0, Math.floor(lastPos.x-win));
        startY=Math.max(0, Math.floor(lastPos.y-win));
        w=Math.min(canvas.width-startX, win*2);
        h=Math.min(canvas.height-startY, win*2);
    }

    let imgData = ctx.getImageData(startX, startY, w, h);
    let data = imgData.data;
    let thresh = parseInt(document.getElementById("sensitivity").value);
    
    let totalX=0, totalY=0, count=0;

    for(let y=0; y<h; y+=2){
        for(let x=0; x<w; x+=2){
            // Gerçek koordinatlar
            let realX = startX + x;
            let realY = startY + y;

            // ÖNEMLİ: Eğer bu piksel yasak bölgedeyse ATLA
            let ignored = false;
            for(let z of ignoreZones){
                if(realX >= z.x && realX <= z.x+z.w && realY >= z.y && realY <= z.y+z.h){
                    ignored = true; break;
                }
            }
            if(ignored) continue;

            // Renk ve Hareket Analizi
            let i = (y*w + x)*4;
            let r=data[i], g=data[i+1], b=data[i+2];

            if(Math.abs(r-g)<15 && Math.abs(g-b)<15) continue; // Gri eleme

            let hsvVal = rgbToHsv(r,g,b);
            if(hueMatch(hsvVal[0]) && hsvVal[1]>hsv.sMin && hsvVal[2]>hsv.vMin){
                
                // Hareket Kontrolü
                let isMoving = true;
                if(previousFrameData && previousFrameData.length === data.length){
                    let diff = Math.abs(r-previousFrameData[i]) + Math.abs(g-previousFrameData[i+1]) + Math.abs(b-previousFrameData[i+2]);
                    if(diff < thresh) isMoving = false;
                }

                if(isMoving){
                    totalX += realX;
                    totalY += realY;
                    count++;
                }
            }
        }
    }
    
    if(!lastPos) previousFrameData = new Uint8ClampedArray(data);

    if(count > 5){
        let curX = totalX/count;
        let curY = totalY/count;

        if(lastPos){
            let dist = Math.hypot(curX-lastPos.x, curY-lastPos.y);
            if(dist > 3){ // Minik titremeleri yok say
                let dt = metadata.mediaTime - lastTime;
                if(dt>0){
                    let speed = (dist * scale) / dt;
                    if(!locked && speed>0.5 && speed<20){
                        if(!capturing) { capturing=true; captureFrames=[]; }
                        captureFrames.push(speed);
                        if(captureFrames.length>=5){
                            launchSpeed = captureFrames.reduce((a,b)=>a+b)/captureFrames.length;
                            locked=true;
                            showResults();
                        }
                    }
                }
                lastPos = {x:curX, y:curY};
                lastTime = metadata.mediaTime;
            }
        } else {
            lastPos = {x:curX, y:curY};
            lastTime = metadata.mediaTime;
        }

        ctx.strokeStyle = "#00ff00";
        ctx.lineWidth = 3;
        ctx.beginPath(); ctx.arc(lastPos.x, lastPos.y, 20, 0, Math.PI*2); ctx.stroke();
    }

    if(!locked) video.requestVideoFrameCallback(processFrame);
}

function showResults(){
    let v = launchSpeed;
    let eff = (v / (2*Math.PI*0.05*(3000/60)))*100;
    document.getElementById("results").innerHTML = 
    `Hız: <b>${v.toFixed(2)} m/s</b><br>Verim: <b>%${eff.toFixed(1)}</b><br><br>Ölçüm Tamamlandı ✅`;
}

function hueMatch(h){
  if(hsv.hMin < hsv.hMax) return h>=hsv.hMin && h<=hsv.hMax;
  else return h>=hsv.hMin || h<=hsv.hMax;
}

function rgbToHsv(r,g,b){
  r/=255; g/=255; b/=255;
  let max=Math.max(r,g,b), min=Math.min(r,g,b);
  let h,s,v=max, d=max-min;
  s=max==0?0:d/max;
  if(max==min)h=0;
  else{
    switch(max){
      case r:h=(g-b)/d+(g<b?6:0);break;
      case g:h=(b-r)/d+2;break;
      case b:h=(r-g)/d+4;break;
    }
    h/=6;
  }
  return [h*360,s*255,v*255];
}
</script>

</body>
</html>
