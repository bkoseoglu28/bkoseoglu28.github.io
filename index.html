<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Robot Shot Analyzer - Motion+Color Engine</title>
<style>
body { background:#0f0f0f; color:#eee; font-family:'Segoe UI', sans-serif; text-align:center; margin:0; overflow:hidden; }

/* Arayüz */
#controls {
  position: absolute; top: 10px; left: 50%; transform: translateX(-50%);
  z-index: 10; background: rgba(0, 0, 0, 0.8); padding: 10px 20px;
  border-radius: 12px; border: 1px solid #333; display: flex; gap: 10px; align-items: center;
  backdrop-filter: blur(5px);
}

.input-group { display: flex; flex-direction: column; font-size: 11px; color: #aaa; text-align: left; }
input[type="number"] { width: 50px; background: #222; border: 1px solid #444; color: white; padding: 4px; border-radius: 4px; }
input[type="range"] { width: 80px; accent-color: #00cec9; }

button {
  padding: 8px 16px; border: none; border-radius: 6px; cursor: pointer;
  font-weight: bold; font-size: 12px; transition: 0.2s; color: white; background: #333;
}
button:hover { background: #555; }
button.primary { background: #0984e3; }
button.danger { background: #d63031; }
button.active { background: #00b894; color: black; box-shadow: 0 0 10px #00b894; }

/* Video Alanı */
#container { position: relative; width: 100vw; height: 100vh; display: flex; justify-content: center; align-items: center; background: #000; }
video { max-width: 100%; max-height: 100%; display: block; }
canvas { position: absolute; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; }

/* Debug View (Siyah Beyaz Ekran) */
#debugCanvas {
  position: absolute; bottom: 10px; right: 10px; width: 200px; height: auto;
  border: 2px solid #00cec9; background: black; z-index: 20; display: none;
}
#results {
  position: absolute; bottom: 20px; left: 20px; text-align: left;
  background: rgba(0,0,0,0.7); padding: 15px; border-radius: 8px; border-left: 4px solid #0984e3;
  font-family: monospace; font-size: 14px; pointer-events: none;
}
</style>
</head>
<body>

<div id="controls">
  <input type="file" id="vidUpload" accept="video/*" style="display:none">
  <button onclick="document.getElementById('vidUpload').click()">📂 Video Aç</button>
  
  <div class="input-group">
    <label>Çubuk (m)</label>
    <input type="number" id="rodLen" value="0.5" step="0.05">
  </div>
  
  <button id="btnCalib" onclick="setMode('CALIBRATE')">📏 1. Kalibre</button>
  <button id="btnSelect" onclick="setMode('SELECT')">🎯 2. Topu Seç</button>
  <button id="btnTrack" class="primary" onclick="toggleTracking()">▶ BAŞLAT</button>
  
  <div class="input-group" style="margin-left:10px">
    <label>Hareket Eşiği</label>
    <input type="range" id="motionThresh" min="5" max="100" value="25" oninput="updateDebug()">
  </div>
  
  <label style="font-size:12px; display:flex; align-items:center; gap:5px; cursor:pointer">
    <input type="checkbox" id="chkDebug" onchange="toggleDebugView()"> 👁️ Matrix Modu
  </label>
</div>

<div id="container">
  <video id="video" playsinline muted onloadedmetadata="resizeCanvas()"></video>
  <canvas id="canvas"></canvas> </div>

<canvas id="debugCanvas"></canvas>

<div id="results">
  Hız: -- m/s<br>Durum: Bekleniyor...
</div>

<script>
const video = document.getElementById("video");
const canvas = document.getElementById("canvas");
const ctx = canvas.getContext("2d");
const debugCanvas = document.getElementById("debugCanvas");
const dCtx = debugCanvas.getContext("2d", { willReadFrequently: true });

// SİSTEM DURUMLARI
let mode = "IDLE"; // IDLE, CALIBRATE, SELECT, TRACKING
let scale = 0; // px to meter

// TAKİP VERİLERİ
let targetColor = { r:0, g:0, b:0 }; // Hedef Rengi
let targetHSV = { h:0, s:0, v:0 };
let lastPos = null;   // Son bilinen konum
let searchBox = 150;  // Arama penceresi boyutu
let prevFrame = null; // Bir önceki kare (Hareket algılama için)

// FİZİK SONUÇLARI
let speeds = [];
let finalSpeed = 0;

// -- BAŞLANGIÇ --
document.getElementById("vidUpload").onchange = e => {
  if(e.target.files[0]){
    video.src = URL.createObjectURL(e.target.files[0]);
    reset();
  }
};

function resizeCanvas(){
  canvas.width = video.videoWidth;
  canvas.height = video.videoHeight;
  debugCanvas.width = video.videoWidth / 4; // Küçük önizleme
  debugCanvas.height = video.videoHeight / 4;
  
  // Ekrana sığdır
  const scale = Math.min(window.innerWidth / video.videoWidth, window.innerHeight / video.videoHeight);
  video.style.width = (video.videoWidth * scale) + "px";
  video.style.height = (video.videoHeight * scale) + "px";
  canvas.style.width = video.style.width;
  canvas.style.height = video.style.height;
}

function reset(){
  mode = "IDLE";
  speeds = [];
  lastPos = null;
  prevFrame = null;
  document.getElementById("btnTrack").innerText = "▶ BAŞLAT";
  document.getElementById("btnTrack").classList.remove("danger");
  ctx.clearRect(0,0,canvas.width,canvas.height);
}

function setMode(m){
  mode = m;
  if(m === 'CALIBRATE') alert("Videoyu çubuğun net olduğu yere getir ve iki ucuna tıkla.");
  if(m === 'SELECT') alert("Videoyu TOPUN havada olduğu yere getir ve topun MERKEZİNE tıkla.");
  
  // Buton stilleri
  document.querySelectorAll("button").forEach(b => b.classList.remove("active"));
  if(m==='CALIBRATE') document.getElementById("btnCalib").classList.add("active");
  if(m==='SELECT') document.getElementById("btnSelect").classList.add("active");
}

// -- TIKLAMA İŞLEYİCİSİ --
// Hem kalibrasyon hem hedef seçimi için tek olay dinleyici
// Canvas pointer-events:none olduğu için video üzerine bir katman ekleyip tıklamayı oradan alıyoruz
// Basitlik için doğrudan window click kullanıp koordinat dönüşümü yapalım:

window.onclick = e => {
  if(e.target.tagName !== "VIDEO" && e.target.id !== "canvas") return; // Sadece videoya tıklayınca
  
  const rect = video.getBoundingClientRect();
  const scaleX = video.videoWidth / rect.width;
  const scaleY = video.videoHeight / rect.height;
  
  const realX = (e.clientX - rect.left) * scaleX;
  const realY = (e.clientY - rect.top) * scaleY;
  
  if(mode === "CALIBRATE") handleCalibration(realX, realY);
  if(mode === "SELECT") handleSelection(realX, realY);
};

let calibPoints = [];
function handleCalibration(x, y){
  calibPoints.push({x, y});
  
  // Görselleştir
  ctx.fillStyle = "#00cec9";
  ctx.beginPath(); ctx.arc(x, y, 5, 0, Math.PI*2); ctx.fill();
  
  if(calibPoints.length === 2){
    let dist = Math.hypot(calibPoints[1].x - calibPoints[0].x, calibPoints[1].y - calibPoints[0].y);
    let realLen = parseFloat(document.getElementById("rodLen").value);
    scale = realLen / dist;
    
    ctx.strokeStyle = "#00cec9"; ctx.lineWidth=2;
    ctx.beginPath(); ctx.moveTo(calibPoints[0].x, calibPoints[0].y); ctx.lineTo(calibPoints[1].x, calibPoints[1].y); ctx.stroke();
    
    alert(`Kalibrasyon Tamam: 1px = ${(scale*1000).toFixed(1)}mm`);
    calibPoints = [];
    mode = "IDLE";
    document.getElementById("btnCalib").classList.remove("active");
  }
}

function handleSelection(x, y){
  // 1. Rengi Al
  const tempCtx = document.createElement("canvas").getContext("2d");
  tempCtx.drawImage(video, 0, 0); // O anki kareyi al
  const p = tempCtx.getImageData(x, y, 1, 1).data;
  
  targetColor = { r:p[0], g:p[1], b:p[2] };
  targetHSV = rgbToHsv(p[0], p[1], p[2]);
  
  // 2. Konumu Kaydet
  lastPos = { x, y };
  
  // Görselleştir
  ctx.strokeStyle = "#e17055"; ctx.lineWidth = 3;
  ctx.beginPath(); ctx.arc(x, y, 20, 0, Math.PI*2); ctx.stroke();
  
  alert("Top Kilitlendi! Sandalyeler artık sorun değil. Başlat'a bas.");
  mode = "READY";
  document.getElementById("btnSelect").classList.remove("active");
}

// -- ANA TAKİP MOTORU (TRACKING ENGINE) --
function toggleTracking(){
  if(mode === "TRACKING"){
    video.pause();
    mode = "IDLE";
    document.getElementById("btnTrack").innerText = "▶ DEVAM ET";
    document.getElementById("btnTrack").classList.remove("danger");
  } else {
    if(!lastPos) { alert("Önce Topu Seç!"); return; }
    if(scale===0) { alert("Önce Kalibrasyon!"); return; }
    
    mode = "TRACKING";
    document.getElementById("btnTrack").innerText = "⏹ DURDUR";
    document.getElementById("btnTrack").classList.add("danger");
    video.play();
    loop();
  }
}

let lastTime = 0;

function loop(){
  if(mode !== "TRACKING") return;
  if(video.paused || video.ended) return;

  // 1. Görüntüyü Al (Sadece Arama Penceresi - Optimizasyon)
  // Topun 150px çevresine bakarız sadece.
  const w = canvas.width; const h = canvas.height;
  
  // Ana Canvas'ı temizle
  ctx.clearRect(0, 0, w, h);
  
  // Geçici canvas'a çiz (Piksel analizi için)
  dCtx.drawImage(video, 0, 0, debugCanvas.width, debugCanvas.height);
  
  // Oranlama (Video -> Debug Canvas)
  const rX = debugCanvas.width / w; 
  const rY = debugCanvas.height / h;
  
  // Küçük resmin verisini al
  const frameData = dCtx.getImageData(0, 0, debugCanvas.width, debugCanvas.height);
  const data = frameData.data;
  
  // Eğer önceki kare yoksa kaydet ve çık
  if(!prevFrame) {
    prevFrame = new Uint8ClampedArray(data);
    requestAnimationFrame(loop);
    return;
  }

  // ANALİZ
  let totalX = 0, totalY = 0, count = 0;
  const thresh = parseInt(document.getElementById("motionThresh").value);
  
  // Arama Penceresi Sınırları (Küçük Canvas Üzerinde)
  let searchRad = 40; // Küçük canvas üzerinde yarıçap
  let startX = Math.max(0, Math.floor((lastPos.x * rX) - searchRad));
  let startY = Math.max(0, Math.floor((lastPos.y * rY) - searchRad));
  let endX = Math.min(debugCanvas.width, startX + searchRad*2);
  let endY = Math.min(debugCanvas.height, startY + searchRad*2);

  // Pikselleri Tara
  for(let y = startY; y < endY; y++){
    for(let x = startX; x < endX; x++){
      const i = (y * debugCanvas.width + x) * 4;
      
      const r = data[i], g = data[i+1], b = data[i+2];
      
      // 1. HAREKET FİLTRESİ (Motion Filter)
      // Önceki kare ile şimdiki kare arasındaki fark
      const pr = prevFrame[i], pg = prevFrame[i+1], pb = prevFrame[i+2];
      const diff = Math.abs(r-pr) + Math.abs(g-pg) + Math.abs(b-pb);
      
      // Eğer değişim eşik değerinden küçükse (Sandalye duruyor), bu pikseli atla!
      if(diff < thresh) {
         // Debug görünümü için siyah yap
         data[i]=0; data[i+1]=0; data[i+2]=0;
         continue; 
      }
      
      // 2. RENK FİLTRESİ (Color Filter)
      // Sadece hareket eden piksellerde renk kontrolü yap
      const hsv = rgbToHsv(r, g, b);
      if(isColorMatch(hsv)){
         totalX += x;
         totalY += y;
         count++;
         
         // Debug için beyaz yap (Bulunan pikseller)
         data[i]=255; data[i+1]=255; data[i+2]=255;
      } else {
         // Hareket var ama renk tutmadı (Örn: Öğrencinin kolu) -> Gri yap
         data[i]=50; data[i+1]=50; data[i+2]=50;
      }
    }
  }
  
  // Bir sonraki tur için bu kareyi "önceki" yap
  // Tüm array'i kopyalamak yerine referans tutarsak bozulur, o yüzden kopyalıyoruz
  // Ama performans için sadece ilgili bölgeyi kopyalamak daha iyi olurdu, şimdilik basit tutalım.
  // Not: Uint8ClampedArray kopyalaması tarayıcıda çok hızlıdır.
  prevFrame.set(frameData.data); 
  
  // Debug görüntüsünü güncelle
  if(document.getElementById("chkDebug").checked){
      dCtx.putImageData(frameData, 0, 0);
  }

  // FİZİK HESABI
  if(count > 5) { // En az 5 piksel bulduysak
    // Küçük canvastaki koordinatı ana videoya geri çevir
    const foundX = (totalX / count) / rX;
    const foundY = (totalY / count) / rY;
    
    // Hız Hesapla
    const dt = (video.currentTime - lastTime);
    if(dt > 0 && dt < 0.1){ // Çok uzun süre geçmişse (takılma) hesaplama
        const dist = Math.hypot(foundX - lastPos.x, foundY - lastPos.y);
        const speed = (dist * scale) / dt;
        
        if(speed > 0.5 && speed < 30) { // Filtre: Çok yavaş veya ışık hızı değilse
            speeds.push(speed);
            // Son 5 karenin ortalamasını al (Smoothing)
            if(speeds.length > 5) speeds.shift();
            finalSpeed = speeds.reduce((a,b)=>a+b)/speeds.length;
            
            document.getElementById("results").innerHTML = 
              `Hız: <b>${finalSpeed.toFixed(2)}</b> m/s<br>Dist: ${(dist*scale).toFixed(2)}m`;
        }
    }
    
    // Yeni konum (Tahmin eklemiyorum, direkt ölçüm)
    lastPos = { x: foundX, y: foundY };
    lastTime = video.currentTime;
    
    // Çiz
    ctx.strokeStyle = "#00cec9";
    ctx.lineWidth = 4;
    ctx.beginPath(); ctx.arc(lastPos.x, lastPos.y, 25, 0, Math.PI*2); ctx.stroke();
  } else {
      // Topu kaybettik! Arama alanını genişlet
      // Ama lastPos'u değiştirme, belki top oraya geri gelir
      ctx.strokeStyle = "red";
      ctx.strokeRect(lastPos.x - 50, lastPos.y - 50, 100, 100);
  }
  
  requestAnimationFrame(loop);
}

// -- YARDIMCILAR --
function isColorMatch(hsv){
    // Hedef renge tolerans uygula
    // Hue: Renk tonu (Dairesel fark)
    let hDiff = Math.abs(hsv.h - targetHSV.h);
    if(hDiff > 180) hDiff = 360 - hDiff;
    
    // Turuncu/Kırmızı tonları hassastır, toleransı düşük tut
    // Value (Parlaklık) çok değişebilir, toleransı yüksek tut
    return hDiff < 20 && hsv.s > 40 && hsv.v > 40;
}

function rgbToHsv(r, g, b) {
    r /= 255, g /= 255, b /= 255;
    var max = Math.max(r, g, b), min = Math.min(r, g, b);
    var h, s, v = max;
    var d = max - min;
    s = max == 0 ? 0 : d / max;
    if (max == min) { h = 0; } else {
        switch (max) {
            case r: h = (g - b) / d + (g < b ? 6 : 0); break;
            case g: h = (b - r) / d + 2; break;
            case b: h = (r - g) / d + 4; break;
        }
        h /= 6;
    }
    return { h: h * 360, s: s * 100, v: v * 100 };
}

function toggleDebugView(){
    const chk = document.getElementById("chkDebug");
    debugCanvas.style.display = chk.checked ? "block" : "none";
}
</script>

</body>
</html>
