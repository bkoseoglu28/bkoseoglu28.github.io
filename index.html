<script>
const video=document.getElementById("video");
const canvas=document.getElementById("canvas");
const ctx=canvas.getContext("2d", { willReadFrequently: true });

let scale=0;
let tracking=false;
let lastPos=null;
let lastTime=null;

// Bir önceki karenin piksel verilerini saklamak için
let previousFrameData = null; 
// Hareket hassasiyeti (Düşük sayı = çok hassas, Yüksek sayı = sadece büyük değişimler)
let motionThreshold = 30; 

let hsv={hMin:0,hMax:0,sMin:60,vMin:60};

let launchSpeed=0;
let capturing=false;
let captureFrames=[];
let locked=false;

document.getElementById("videoUpload").onchange=e=>{
  if(e.target.files && e.target.files[0]){
    video.src=URL.createObjectURL(e.target.files[0]);
    locked=false;
    launchSpeed=0;
    lastPos=null;
    previousFrameData=null; // Videoyu değiştirince hafızayı temizle
  }
};

video.onloadedmetadata=()=>{
  canvas.width=video.videoWidth;
  canvas.height=video.videoHeight;
};

function getMousePos(evt){
  const rect = canvas.getBoundingClientRect();
  const scaleX = canvas.width / rect.width;
  const scaleY = canvas.height / rect.height;
  return {
    x: (evt.clientX - rect.left) * scaleX,
    y: (evt.clientY - rect.top) * scaleY
  };
}

function grabFrame(){
  video.pause();
  ctx.drawImage(video,0,0,canvas.width,canvas.height);
}

function calibrate(){
  let points=[];
  alert("Referans çubuğunun iki ucuna tıkla");

  canvas.onclick=e=>{
    const pos=getMousePos(e);
    points.push(pos);

    ctx.drawImage(video,0,0,canvas.width,canvas.height);
    ctx.fillStyle="red";
    points.forEach(p => {
        ctx.beginPath(); ctx.arc(p.x,p.y,5,0,Math.PI*2); ctx.fill();
    });

    if(points.length==2){
      ctx.strokeStyle="red";
      ctx.lineWidth=3;
      ctx.beginPath();
      ctx.moveTo(points[0].x,points[0].y);
      ctx.lineTo(points[1].x,points[1].y);
      ctx.stroke();

      let rod=parseFloat(document.getElementById("rodLength").value);
      let dx=points[1].x-points[0].x;
      let dy=points[1].y-points[0].y;
      let pixelDist=Math.sqrt(dx*dx+dy*dy);
      
      if(pixelDist > 0) {
        scale=rod/pixelDist;
        alert(`Kalibrasyon: 1 px = ${(scale*1000).toFixed(2)} mm`);
      }
      canvas.onclick=null;
    }
  };
}

function toggleHSV(){
  alert("Topun rengini seçmek için üzerine tıkla");
  canvas.onclick=e=>{
    const pos=getMousePos(e);
    let data=ctx.getImageData(pos.x,pos.y,1,1).data;
    let hsvVal=rgbToHsv(data[0],data[1],data[2]);

    let h=hsvVal[0];
    hsv.hMin=(h-15+360)%360; // Toleransı biraz artırdım (±15)
    hsv.hMax=(h+15)%360;
    hsv.sMin=Math.max(20, hsvVal[1] - 60); 
    hsv.vMin=Math.max(20, hsvVal[2] - 60);

    canvas.onclick=null;
    alert(`Renk Ayarlandı. Hareket eden cisimler aranacak.`);
  };
}

function toggleTracking(){
  tracking=!tracking;
  if(tracking){
    lastPos=null;
    lastTime=null;
    launchSpeed=0;
    captureFrames=[];
    capturing=false;
    locked=false;
    previousFrameData = null; // Takip başlayınca resetle
    
    if(scale === 0) {
        alert("Önce Kalibrasyon Yap!");
        tracking = false;
        return;
    }
    
    video.play();
    video.requestVideoFrameCallback(processFrame);
  } else {
    video.pause();
  }
}

function hueMatch(h){
  if(hsv.hMin<hsv.hMax)
    return h>=hsv.hMin && h<=hsv.hMax;
  else
    return h>=hsv.hMin || h<=hsv.hMax;
}

function processFrame(now, metadata){
  if(!tracking) return;

  ctx.drawImage(video,0,0,canvas.width,canvas.height);
  
  // Arama Penceresi (Search Window)
  let startX = 0, startY = 0, w = canvas.width, h = canvas.height;
  
  if(lastPos) {
      const windowSize = 200; // Pencereyi biraz genişlettim hızlı toplar için
      startX = Math.max(0, Math.floor(lastPos.x - windowSize));
      startY = Math.max(0, Math.floor(lastPos.y - windowSize));
      w = Math.min(canvas.width - startX, windowSize * 2);
      h = Math.min(canvas.height - startY, windowSize * 2);
  }

  // Şu anki karenin verisini al
  let img = ctx.getImageData(startX, startY, w, h);
  let data = img.data;
  
  // Bir önceki karenin verisini al (Eğer pencere boyutu değişmediyse)
  // Not: Basitlik için sadece window içindeki değişime bakacağız.
  
  let totalX=0, totalY=0, count=0;

  for(let y=0; y<h; y+=2){
    for(let x=0; x<w; x+=2){
      let i=(y*w+x)*4;
      let r=data[i], g=data[i+1], b=data[i+2];

      // 1. Önce RENK kontrolü (İşlemciyi yormamak için)
      if(Math.abs(r-g)<10 && Math.abs(g-b)<10) continue; // Gri/Beyaz eleme

      let hsvVal=rgbToHsv(r,g,b);
      if(hueMatch(hsvVal[0]) && hsvVal[1]>hsv.sMin && hsvVal[2]>hsv.vMin){
        
        // 2. HAREKET KONTROLÜ (Motion Detection)
        let isMoving = false;
        if(previousFrameData && previousFrameData.length === data.length) {
            let pr = previousFrameData[i];
            let pg = previousFrameData[i+1];
            let pb = previousFrameData[i+2];
            
            // RGB farkı toplamı
            let diff = Math.abs(r-pr) + Math.abs(g-pg) + Math.abs(b-pb);
            
            if(diff > motionThreshold) {
                isMoving = true;
            }
        } else {
            // İlk karede hareket kontrolü yapamayız, mecburen kabul ediyoruz
            isMoving = true; 
        }

        if(isMoving) {
            totalX += (startX + x);
            totalY += (startY + y);
            count++;
        }
      }
    }
  }

  // Mevcut kareyi, bir sonraki döngüde kullanmak üzere sakla
  // Uint8ClampedArray'i kopyalamamız lazım yoksa referans tutar
  previousFrameData = new Uint8ClampedArray(data);

  if(count > 5){
    let currentX = totalX / count;
    let currentY = totalY / count;

    if(lastPos!==null){
      let dx=(currentX-lastPos.x)*scale;
      let dy=(currentY-lastPos.y)*scale;
      let dt=(metadata.mediaTime - lastTime);

      if(dt>0.001){
        let speed=Math.sqrt(dx*dx+dy*dy)/dt;

        if(!locked){
          if(speed>0.5 && !capturing){
            capturing=true;
            captureFrames=[];
          }
          if(capturing){
            captureFrames.push(speed);
            if(captureFrames.length>=5){
              launchSpeed = captureFrames.reduce((a,b)=>a+b)/captureFrames.length;
              locked=true;
              capturing=false;
              calculatePhysics();
            }
          }
        }
      }
    }

    lastPos={x:currentX,y:currentY};
    lastTime=metadata.mediaTime;

    ctx.strokeStyle="#00ff00"; // Yeşil halka
    ctx.lineWidth=3;
    ctx.beginPath();
    ctx.arc(currentX, currentY, 20, 0, Math.PI*2);
    ctx.stroke();
  }

  if(locked) calculatePhysics();
  video.requestVideoFrameCallback(processFrame);
}

function calculatePhysics(){
  let measured=launchSpeed;
  let rpm=parseFloat(document.getElementById("rpm").value)||0;
  let angleDeg=parseFloat(document.getElementById("angle").value)||0;
  let wheelRadius=0.05; 
  let wheelSpeed=2*Math.PI*wheelRadius*(rpm/60);
  let efficiency= wheelSpeed>0 ? (measured/wheelSpeed)*100 : 0;
  let ballRadius=0.07; 
  let ballMass=0.27; 
  let airDensity=1.225;
  let omega=2*Math.PI*(rpm/60); 
  let spinRatio = measured>0 ? (omega*ballRadius)/measured : 0;
  let C_L = Math.min(1.5 * spinRatio, 1.2); 
  let area = Math.PI*ballRadius*ballRadius;
  let magnusForce = 0.5*airDensity*area*measured*measured*C_L;
  let magnusAccel = ballMass>0 ? magnusForce/ballMass : 0;
  let effectiveG = 9.81 - magnusAccel;

  document.getElementById("results").innerHTML=
  `<strong>Measured Speed:</strong> ${measured.toFixed(2)} m/s<br>
   <strong>Wheel Speed:</strong> ${wheelSpeed.toFixed(2)} m/s<br>
   <strong>Efficiency:</strong> ${efficiency.toFixed(1)} %<br>
   <hr>
   <strong>Magnus Accel:</strong> ${magnusAccel.toFixed(2)} m/s²<br>
   <strong>Eff. Gravity:</strong> ${effectiveG.toFixed(2)} m/s²<br>
   <span style="color:${effectiveG<9.81?'lime':'red'}">${effectiveG<9.81?"LIFT ✈️":"DROP ⬇️"}</span>`;
}

function rgbToHsv(r,g,b){
  r/=255; g/=255; b/=255;
  let max=Math.max(r,g,b),min=Math.min(r,g,b);
  let h,s,v=max;
  let d=max-min;
  s=max==0?0:d/max;

  if(max==min){h=0;}
  else{
    switch(max){
      case r:h=(g-b)/d+(g<b?6:0);break;
      case g:h=(b-r)/d+2;break;
      case b:h=(r-g)/d+4;break;
    }
    h/=6;
  }
  return [h*360,s*255,v*255];
}
</script>
