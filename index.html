<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Robot Shot Analyzer</title>
<style>
body { background:#111; color:white; font-family:Arial; text-align:center; }

.container{
  display:flex;
  justify-content:center;
  gap:20px;
  flex-wrap:wrap;
}

video, canvas{
  max-width:45vw;
  height:auto;
  border:1px solid white;
}
input{ width:70px; }
button{ margin:4px; padding:5px 10px; }
</style>
</head>
<body>

<h2>Robot Shot Analyzer</h2>

<input type="file" id="videoUpload" accept="video/*"><br><br>

Rod Length (m): <input type="number" id="rodLength" step="0.01" value="0.5">
Angle (deg): <input type="number" id="angle" step="1" value="45">
Wheel RPM: <input type="number" id="rpm" step="10" value="3000"><br><br>

<button onclick="grabFrame()">Select Frame</button>
<button onclick="calibrate()">Calibrate Rod</button>
<button onclick="toggleHSV()">HSV Pick</button>
<button onclick="toggleTracking()">Start / Stop Tracking</button>

<br><br>

<div class="container">
  <video id="video" controls></video>
  <canvas id="canvas"></canvas>
</div>

<h3 id="results"></h3>

<script>
const video=document.getElementById("video");
const canvas=document.getElementById("canvas");
const ctx=canvas.getContext("2d");

let scale=1;
let tracking=false;
let lastPos=null;
let lastTime=null;
let velocities=[];
let calibrationPoints=[];
let hsv={hMin:20,hMax:40,sMin:80,vMin:80};

function getMousePos(evt){
  const rect = canvas.getBoundingClientRect();
  const scaleX = canvas.width / rect.width;
  const scaleY = canvas.height / rect.height;
  return {
    x: (evt.clientX - rect.left) * scaleX,
    y: (evt.clientY - rect.top) * scaleY
  };
}

document.getElementById("videoUpload").onchange=e=>{
  video.src=URL.createObjectURL(e.target.files[0]);
};

video.onloadedmetadata=()=>{
  canvas.width=video.videoWidth;
  canvas.height=video.videoHeight;
};

function grabFrame(){
  video.pause();
  ctx.drawImage(video,0,0,canvas.width,canvas.height);
}

function calibrate(){
  calibrationPoints=[];
  alert("Çubuğun iki ucuna tıkla");

  canvas.onclick=e=>{
    const pos=getMousePos(e);
    calibrationPoints.push(pos);

    ctx.drawImage(video,0,0,canvas.width,canvas.height);

    ctx.fillStyle="red";
    ctx.beginPath();
    ctx.arc(pos.x,pos.y,8,0,Math.PI*2);
    ctx.fill();

    if(calibrationPoints.length==2){

      ctx.strokeStyle="red";
      ctx.lineWidth=4;
      ctx.beginPath();
      ctx.moveTo(calibrationPoints[0].x,calibrationPoints[0].y);
      ctx.lineTo(calibrationPoints[1].x,calibrationPoints[1].y);
      ctx.stroke();

      let rod=parseFloat(document.getElementById("rodLength").value);
      let dx=calibrationPoints[1].x-calibrationPoints[0].x;
      let dy=calibrationPoints[1].y-calibrationPoints[0].y;
      let pixelDist=Math.sqrt(dx*dx+dy*dy);
      scale=rod/pixelDist;

      canvas.onclick=null;
      alert("Kalibrasyon tamam ✅");
    }
  };
}

function toggleHSV(){
  alert("Topa tıkla");
  canvas.onclick=e=>{
    const pos=getMousePos(e);
    let data=ctx.getImageData(pos.x,pos.y,1,1).data;
    let h=rgbToHsv(data[0],data[1],data[2])[0];
    hsv.hMin=h-10;
    hsv.hMax=h+10;
    canvas.onclick=null;
    alert("HSV ayarlandı ✅");
  };
}

function toggleTracking(){
  tracking=!tracking;

  if(tracking){
    lastPos=null;
    lastTime=null;
    velocities=[];
    video.play();
    video.requestVideoFrameCallback(processFrame);
  }
}

function processFrame(now, metadata){
  if(!tracking) return;

  ctx.drawImage(video,0,0,canvas.width,canvas.height);

  let img=ctx.getImageData(0,0,canvas.width,canvas.height);
  let data=img.data;

  let blobs=[];
  let visited=new Uint8Array(canvas.width*canvas.height);

  function index(x,y){
    return y*canvas.width+x;
  }

  function isMatch(i){
    let hsvVal=rgbToHsv(data[i],data[i+1],data[i+2]);
    return (
      hsvVal[0]>=hsv.hMin && hsvVal[0]<=hsv.hMax &&
      hsvVal[1]>hsv.sMin &&
      hsvVal[2]>hsv.vMin
    );
  }

  for(let y=0;y<canvas.height;y++){
    for(let x=0;x<canvas.width;x++){

      let idx=index(x,y);
      if(visited[idx]) continue;

      let pixelIndex=idx*4;
      if(!isMatch(pixelIndex)) continue;

      let stack=[[x,y]];
      let blob=[];
      visited[idx]=1;

      while(stack.length>0){
        let [cx,cy]=stack.pop();
        blob.push([cx,cy]);

        let neighbors=[
          [cx+1,cy],[cx-1,cy],
          [cx,cy+1],[cx,cy-1]
        ];

        for(let [nx,ny] of neighbors){
          if(nx>=0 && ny>=0 && nx<canvas.width && ny<canvas.height){
            let nIdx=index(nx,ny);
            if(!visited[nIdx]){
              visited[nIdx]=1;
              let pIndex=nIdx*4;
              if(isMatch(pIndex)){
                stack.push([nx,ny]);
              }
            }
          }
        }
      }

      if(blob.length>200){
        blobs.push(blob);
      }
    }
  }

  if(blobs.length>0){

    blobs.sort((a,b)=>b.length-a.length);
    let largest=blobs[0];

    let sumX=0,sumY=0;
    for(let p of largest){
      sumX+=p[0];
      sumY+=p[1];
    }

    let x=sumX/largest.length;
    let y=sumY/largest.length;

    if(lastPos!==null){
      let dx=(x-lastPos.x)*scale;
      let dy=(y-lastPos.y)*scale;
      let dt=metadata.mediaTime-lastTime;

      if(dt>0){
        let speed=Math.sqrt(dx*dx+dy*dy)/dt;
        if(speed>0.3){
          velocities.push(speed);
        }
      }
    }

    lastPos={x,y};
    lastTime=metadata.mediaTime;

    ctx.strokeStyle="lime";
    ctx.lineWidth=3;
    ctx.beginPath();
    ctx.arc(x,y,12,0,Math.PI*2);
    ctx.stroke();
  }

  calculatePhysics();
  video.requestVideoFrameCallback(processFrame);
}
function calculatePhysics(){

  let measured=0;
  if(velocities.length>0){
    measured=velocities.reduce((a,b)=>a+b)/velocities.length;
  }

  let rpm=parseFloat(document.getElementById("rpm").value)||0;
  let wheelRadius=0.05;
  let wheelSpeed=2*Math.PI*wheelRadius*(rpm/60);
  let efficiency= wheelSpeed>0 ? (measured/wheelSpeed)*100 : 0;

  let angleDeg=parseFloat(document.getElementById("angle").value)||0;

  let g=9.81;
  let magnus=(rpm/60)*0.1;
  let effectiveG=g-magnus;

  document.getElementById("results").innerHTML=
  `Measured Speed: ${measured.toFixed(2)} m/s<br>
   Wheel Surface Speed: ${wheelSpeed.toFixed(2)} m/s<br>
   Efficiency: ${efficiency.toFixed(1)} %<br><br>
   Launch Angle: ${angleDeg}°<br>
   Effective g: ${effectiveG.toFixed(2)} m/s²<br>
   Magnus: ${magnus.toFixed(2)} m/s²<br>
   Backspin ${magnus>1?"Var 🌀":"Yok"}`;
}

function rgbToHsv(r,g,b){
  r/=255; g/=255; b/=255;
  let max=Math.max(r,g,b),min=Math.min(r,g,b);
  let h,s,v=max;
  let d=max-min;
  s=max==0?0:d/max;

  if(max==min){h=0;}
  else{
    switch(max){
      case r:h=(g-b)/d+(g<b?6:0);break;
      case g:h=(b-r)/d+2;break;
      case b:h=(r-g)/d+4;break;
    }
    h/=6;
  }
  return [h*360,s*255,v*255];
}
</script>

</body>
</html>
