<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Robot Shot Analyzer - Ultimate</title>
<style>
  body { background:#111; color:#eee; font-family:sans-serif; text-align:center; margin:0; overflow:hidden; }
  
  /* Alt Kontrol Paneli */
  #controls {
    position: absolute; bottom: 0; left: 0; width: 100%; height: 140px;
    background: #222; border-top: 1px solid #444; z-index: 100;
    display: flex; flex-direction: column; justify-content: center; align-items: center;
    gap: 10px; padding-bottom: 10px;
  }
  
  .row { display: flex; gap: 15px; align-items: center; width: 90%; justify-content: center; }
  
  /* Slider */
  input[type="range"]#seekBar { width: 100%; cursor: pointer; accent-color: #0984e3; height: 5px; }
  
  /* Inputs & Buttons */
  input[type="number"] { width: 50px; background: #333; color: white; border: 1px solid #555; padding: 5px; text-align: center; }
  
  button { 
    padding: 8px 15px; cursor: pointer; background: #333; color: white; border: 1px solid #555; 
    border-radius: 4px; font-weight: bold; min-width: 100px;
  }
  button:hover { background: #555; }
  button.active { background: #e17055; border-color: red; }
  button.green { background: #00b894; border: none; color: black; box-shadow: 0 0 10px #00b894; }

  /* Video Alanı */
  #stage { position: absolute; top: 0; left: 0; width: 100%; height: calc(100vh - 140px); background: black; display: flex; justify-content: center; align-items: center; }
  video { max-width: 100%; max-height: 100%; display: block; }
  canvas { position: absolute; top: 0; left: 0; width: 100%; height: 100%; pointer-events: auto; }

  #info { 
    position: absolute; top: 10px; left: 10px; background: rgba(0,0,0,0.7); 
    padding: 10px; border-radius: 5px; pointer-events: none; text-align: left;
  }
</style>
</head>
<body>

<div id="stage">
  <video id="video" playsinline muted></video>
  <canvas id="canvas"></canvas>
  <div id="info">Durum: Video Yükle...</div>
</div>

<div id="controls">
  <div class="row" style="width: 95%;">
    <span style="font-size:12px">Frame:</span>
    <button onclick="seek(-0.03)" style="min-width:40px">⏪</button>
    <input type="range" id="seekBar" value="0" step="0.001" oninput="manualSeek()">
    <button onclick="seek(0.03)" style="min-width:40px">⏩</button>
  </div>

  <div class="row">
    <input type="file" id="up" accept="video/*" style="width:180px">
    <span>Çubuk (m): <input type="number" id="rod" value="0.5" step="0.05"></span>
    <span title="Düşük=Hassas, Yüksek=Kaba">Hassasiyet: <input type="number" id="sens" value="25"></span>
  </div>

  <div class="row">
    <button onclick="setMode('CALIB')" id="bCalib">1. Kalibre</button>
    <button onclick="setMode('SELECT')" id="bSel">2. Hedef Seç</button>
    <button onclick="toggleRun()" id="bRun" class="green">3. BAŞLAT</button>
    <button onclick="reset()" style="background:#d63031; border:none;">Sıfırla</button>
  </div>
</div>

<script>
const video = document.getElementById("video");
const canvas = document.getElementById("canvas");
const ctx = canvas.getContext("2d", { willReadFrequently: true });
const seekBar = document.getElementById("seekBar");
const info = document.getElementById("info");

// DURUMLAR
let mode = "IDLE"; 
let scale = 0; // px -> metre
let running = false;

// TRACKING
let targetHSV = {h:0, s:0, v:0};
let lastPos = null;
let lastTime = 0;
let prevFrameData = null; // Hareket algılama için hafıza

// FİZİK
let speeds = [];

// -- VİDEO YÖNETİMİ --
document.getElementById("up").onchange = e => {
  if(e.target.files[0]) {
    video.src = URL.createObjectURL(e.target.files[0]);
    reset();
  }
};

video.onloadedmetadata = () => {
  canvas.width = video.videoWidth;
  canvas.height = video.videoHeight;
  seekBar.max = video.duration;
  resize();
};

window.onresize = resize;
function resize(){
  // Canvas'ı videonun ekrandaki boyutuna eşitle (Tıklama koordinatları için önemli)
  // Basit tutmak için CSS ile hallediyoruz, burası sadece tetikleyici.
}

video.ontimeupdate = () => {
  if(!running) seekBar.value = video.currentTime;
};

function manualSeek(){
  video.currentTime = seekBar.value;
  stopRun(); // Elle sarınca takibi durdur
  drawFrame(); // O kareyi göster
}

function seek(dt){
  video.currentTime = Math.max(0, Math.min(video.duration, video.currentTime + dt));
  stopRun();
  setTimeout(drawFrame, 50); // Video update beklet
}

function drawFrame(){
  ctx.clearRect(0,0,canvas.width,canvas.height);
  // Video zaten arkada oynuyor, canvas sadece çizimler için
  if(lastPos) {
      ctx.strokeStyle="lime"; ctx.lineWidth=2; 
      ctx.strokeRect(lastPos.x-20, lastPos.y-20, 40, 40);
  }
}

// -- ETKİLEŞİM --
function setMode(m){
  mode = m;
  stopRun();
  updateButtons();
  if(m==='CALIB') info.innerHTML = "Çubuğun iki ucuna tıkla.";
  if(m==='SELECT') info.innerHTML = "Videoyu kaydır, topun olduğu kareye gel ve topa tıkla.";
}

// Tıklama Koordinat Dönüşümü
canvas.onmousedown = e => {
  const rect = video.getBoundingClientRect(); // Videonun ekrandaki boyutu
  const scaleX = video.videoWidth / rect.width;
  const scaleY = video.videoHeight / rect.height;
  
  // Tıklanan yerin videodaki gerçek piksel karşılığı
  const x = (e.clientX - rect.left) * scaleX;
  const y = (e.clientY - rect.top) * scaleY;
  
  if(mode === 'CALIB') doCalib(x, y);
  if(mode === 'SELECT') doSelect(x, y);
};

let calibPts = [];
function doCalib(x, y){
  calibPts.push({x,y});
  ctx.fillStyle="cyan"; ctx.beginPath(); ctx.arc(x,y,5,0,Math.PI*2); ctx.fill();
  
  if(calibPts.length === 2){
    let dist = Math.hypot(calibPts[1].x - calibPts[0].x, calibPts[1].y - calibPts[0].y);
    let real = parseFloat(document.getElementById("rod").value);
    scale = real / dist;
    info.innerHTML = `Kalibre: 1m = ${(1/scale).toFixed(0)}px. Şimdi Hedef Seç.`;
    calibPts = [];
    mode = "IDLE";
    updateButtons();
  }
}

function doSelect(x, y){
  // O anki kareden rengi al
  const tempC = document.createElement("canvas");
  tempC.width = video.videoWidth; tempC.height = video.videoHeight;
  const tCtx = tempC.getContext("2d");
  tCtx.drawImage(video, 0, 0);
  const p = tCtx.getImageData(x, y, 1, 1).data;
  
  targetHSV = rgbToHsv(p[0], p[1], p[2]);
  lastPos = {x, y};
  
  info.innerHTML = `Hedef Seçildi! Konum: ${x.toFixed(0)},${y.toFixed(0)}. Başlat'a bas.`;
  drawFrame(); // Seçim karesini çiz
  mode = "READY";
  updateButtons();
}

// -- ÇALIŞTIRMA (Motion + Color Engine) --
function toggleRun(){
  if(running) stopRun();
  else {
    if(!lastPos) { alert("Hedef seçmedin!"); return; }
    if(scale===0) { alert("Kalibre etmedin!"); return; }
    running = true;
    prevFrameData = null; // Hareket hafızasını sıfırla
    video.play();
    loop();
    updateButtons();
  }
}

function stopRun(){
  running = false;
  video.pause();
  updateButtons();
}

function loop(){
  if(!running || video.paused) return;

  // 1. Görüntü Al
  const w = canvas.width, h = canvas.height;
  const tempC = document.createElement("canvas"); // Offscreen canvas for processing
  tempC.width = w/4; tempC.height = h/4; // Performans için küçük işle
  const tCtx = tempC.getContext("2d", {willReadFrequently:true});
  
  tCtx.drawImage(video, 0, 0, tempC.width, tempC.height);
  const frame = tCtx.getImageData(0,0,tempC.width,tempC.height);
  const data = frame.data;
  
  if(!prevFrameData) {
    prevFrameData = new Uint8ClampedArray(data);
    requestAnimationFrame(loop);
    return;
  }

  // 2. Analiz (Motion + Color)
  let sumX=0, sumY=0, count=0;
  const thresh = parseInt(document.getElementById("sens").value);
  const ratio = 4; // Küçültme oranı
  
  // Arama Penceresi (Sadece lastPos etrafı)
  let box = 100 / ratio; 
  let sx = Math.max(0, Math.floor((lastPos.x/ratio) - box));
  let sy = Math.max(0, Math.floor((lastPos.y/ratio) - box));
  let ex = Math.min(tempC.width, sx + box*2);
  let ey = Math.min(tempC.height, sy + box*2);

  for(let y=sy; y<ey; y++){
    for(let x=sx; x<ex; x++){
      const i = (y * tempC.width + x) * 4;
      
      // HAREKET KONTROLÜ (Sandalye Filtresi)
      const diff = Math.abs(data[i]-prevFrameData[i]) + 
                   Math.abs(data[i+1]-prevFrameData[i+1]) + 
                   Math.abs(data[i+2]-prevFrameData[i+2]);
      
      if(diff > thresh){ // Sadece hareket edenler
        
        // RENK KONTROLÜ
        const hsv = rgbToHsv(data[i], data[i+1], data[i+2]);
        if(isMatch(hsv)){
          sumX += x; sumY += y; count++;
        }
      }
    }
  }

  // Hafızayı güncelle
  prevFrameData.set(data);

  // 3. Sonuç
  ctx.clearRect(0,0,w,h);
  
  if(count > 2){
    let curX = (sumX / count) * ratio;
    let curY = (sumY / count) * ratio;
    
    // Hız
    let dt = video.currentTime - lastTime;
    if(dt>0 && dt<0.1){
      let dist = Math.hypot(curX-lastPos.x, curY-lastPos.y);
      let v = (dist * scale) / dt;
      if(v > 0.5 && v < 25) {
        info.innerHTML = `<b style='color:lime; font-size:20px'>Hız: ${v.toFixed(2)} m/s</b>`;
        speeds.push(v);
      }
    }
    
    lastPos = {x:curX, y:curY};
    lastTime = video.currentTime;

    // Görsel
    ctx.strokeStyle="#00cec9"; ctx.lineWidth=3;
    ctx.beginPath(); ctx.arc(curX, curY, 25, 0, Math.PI*2); ctx.stroke();
  } else {
    // Kaybolursa pencereyi çiz (debug)
    ctx.strokeStyle="red"; ctx.strokeRect(lastPos.x-50, lastPos.y-50, 100, 100);
  }

  requestAnimationFrame(loop);
}

// -- YARDIMCI --
function isMatch(h){
  let hd = Math.abs(h.h - targetHSV.h);
  if(hd > 180) hd = 360 - hd;
  // Düşük tolerans (sandalye kırmızı/turuncu karışmasın diye)
  return hd < 20 && h.s > 40 && h.v > 40;
}

function rgbToHsv(r,g,b){
  r/=255; g/=255; b/=255;
  let max=Math.max(r,g,b), min=Math.min(r,g,b);
  let h,s,v=max, d=max-min;
  s=max==0?0:d/max;
  if(max==min)h=0;
  else{
    switch(max){
      case r:h=(g-b)/d+(g<b?6:0);break;
      case g:h=(b-r)/d+2;break;
      case b:h=(r-g)/d+4;break;
    }
    h/=6;
  }
  return {h:h*360, s:s*100, v:v*100};
}

function reset(){
  stopRun();
  mode="IDLE"; lastPos=null; speeds=[];
  updateButtons();
  info.innerHTML = "Sıfırlandı.";
  ctx.clearRect(0,0,canvas.width,canvas.height);
}

function updateButtons(){
  document.getElementById("bCalib").className = mode==="CALIB"?"active":"";
  document.getElementById("bSel").className = mode==="SELECT"?"active":"";
  document.getElementById("bRun").innerText = running ? "DURDUR" : "3. BAŞLAT";
}
</script>
</body>
</html>
