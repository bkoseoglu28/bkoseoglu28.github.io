<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Robot Shot Analyzer - Frame Control</title>
<style>
body { background:#111; color:#eee; font-family:Arial, sans-serif; text-align:center; user-select:none; }
.container { position: relative; display:inline-block; margin-top:10px; border:1px solid #555; }
video { display:block; max-width:80vw; max-height:70vh; }
canvas { position:absolute; top:0; left:0; width:100%; height:100%; cursor:crosshair; }

/* Kontrol Paneli Tasarımı */
.panel { background:#222; padding:15px; margin:10px auto; width:90%; max-width:800px; border-radius:8px; border:1px solid #444; }
.row { display:flex; justify-content:center; gap:10px; align-items:center; flex-wrap:wrap; margin-bottom:10px; }

input[type="number"] { width:60px; background:#333; color:white; border:1px solid #555; padding:5px; text-align:center; }
input[type="file"] { color:#ccc; }

/* Slider (Video Çubuğu) */
input[type="range"] { width: 100%; cursor: pointer; accent-color: #0984e3; }

button { 
  padding:8px 16px; cursor:pointer; background:#333; color:white; 
  border:1px solid #555; font-weight:bold; border-radius:4px;
}
button:hover { background:#555; }
button.active { background:#e17055; border-color:red; color:white; }
button.green { background:#00b894; border:none; color:black; }

#results { background:#222; padding:15px; border:1px solid #444; display:inline-block; min-width:300px; margin-top:10px; }
</style>
</head>
<body>

<h2>Robot Shot Analyzer (Frame Kontrollü)</h2>

<div class="panel">
  <div class="row">
    <input type="file" id="videoUpload" accept="video/*">
  </div>

  <div class="row">
    <button onclick="moveFrame(-0.05)">⏪ Geri</button>
    <input type="range" id="seekBar" value="0" step="0.001">
    <button onclick="moveFrame(0.05)">İleri ⏩</button>
  </div>

  <div class="row">
    <span>Çubuk (m): <input type="number" id="rodLength" step="0.01" value="0.5"></span>
    <span>RPM: <input type="number" id="rpm" value="3000"></span>
    <span>Açı: <input type="number" id="angle" value="45"></span>
  </div>

  <div class="row">
    <button onclick="startCalibration()" id="btnCalib">1. Kalibre Et</button>
    <button onclick="startTargetSelection()" id="btnTarget">2. Hedef Seç (Top)</button>
    <button class="green" onclick="runTracking()" id="btnTrack">3. BAŞLAT</button>
    <button onclick="resetAll()">Sıfırla</button>
  </div>
</div>

<div class="container">
  <video id="video" playsinline muted></video>
  <canvas id="canvas"></canvas>
</div>

<div id="results">Veri bekleniyor...</div>

<script>
const video = document.getElementById("video");
const canvas = document.getElementById("canvas");
const ctx = canvas.getContext("2d", { willReadFrequently: true });
const seekBar = document.getElementById("seekBar");

// SİSTEM DURUMLARI
let state = "IDLE"; // IDLE, CALIBRATING, SELECTING_TARGET, TRACKING
let scale = 0;      // Pixel to Meter

// HEDEF VERİLERİ
let targetColor = { r:0, g:0, b:0 }; // Seçilen renk
let targetHSV = { h:0, s:0, v:0 };   // Seçilen HSV
let lastPos = null;                  // Topun son konumu
let searchWindow = 100;              // Sadece topun etrafındaki 100px'i tara

// FİZİK HESAPLAMA
let captureFrames = [];
let locked = false;
let launchSpeed = 0;
let lastTime = 0;

// --- VİDEO YÖNETİMİ ---
document.getElementById("videoUpload").onchange = e => {
  if(e.target.files[0]){
    video.src = URL.createObjectURL(e.target.files[0]);
    resetAll();
  }
};

video.onloadedmetadata = () => {
  canvas.width = video.videoWidth;
  canvas.height = video.videoHeight;
  seekBar.max = video.duration;
  drawUI();
};

video.ontimeupdate = () => {
  seekBar.value = video.currentTime;
  if(state !== "TRACKING") drawUI(); // Videoyu elle kaydırırken overlay çiz
};

seekBar.oninput = () => {
  video.currentTime = seekBar.value;
  // Manuel kaydırmada takibi durdur
  if(state === "TRACKING") stopTracking();
};

function moveFrame(delta){
  video.currentTime = Math.max(0, Math.min(video.duration, video.currentTime + delta));
}

function getMousePos(evt){
  const rect = canvas.getBoundingClientRect();
  return {
    x: (evt.clientX - rect.left) * (canvas.width / rect.width),
    y: (evt.clientY - rect.top) * (canvas.height / rect.height)
  };
}

// --- 1. KALİBRASYON ---
let calibPoints = [];
function startCalibration(){
  state = "CALIBRATING";
  calibPoints = [];
  alert("Videonun kaydırma çubuğunu kullanarak ÇUBUĞUN en net olduğu kareye gel.\nSonra çubuğun iki ucuna tıkla.");
  updateButtons();
  
  canvas.onmousedown = e => {
    if(state !== "CALIBRATING") return;
    calibPoints.push(getMousePos(e));
    drawUI();
    
    if(calibPoints.length === 2){
      let rodLen = parseFloat(document.getElementById("rodLength").value);
      let dist = Math.hypot(calibPoints[1].x - calibPoints[0].x, calibPoints[1].y - calibPoints[0].y);
      if(dist > 0){
        scale = rodLen / dist;
        alert("Kalibrasyon Tamam!");
        state = "IDLE";
        canvas.onmousedown = null;
        updateButtons();
      }
    }
  };
}

// --- 2. HEDEF SEÇİMİ (TIKLA VE KİLİTLE) ---
function startTargetSelection(){
  if(scale === 0){ alert("Önce Kalibrasyon!"); return; }
  state = "SELECTING_TARGET";
  alert("Videoyu kaydırarak TOPUN havada net olduğu bir ana gel.\nSonra tam topun merkezine tıkla.");
  updateButtons();

  canvas.onmousedown = e => {
    if(state !== "SELECTING_TARGET") return;
    let p = getMousePos(e);
    
    // Rengi al (5x5 ortalama)
    let imgData = ctx.getImageData(p.x-2, p.y-2, 5, 5).data;
    let r=0, g=0, b=0, count=0;
    for(let i=0; i<imgData.length; i+=4){
        r+=imgData[i]; g+=imgData[i+1]; b+=imgData[i+2]; count++;
    }
    targetColor = { r:r/count, g:g/count, b:b/count };
    targetHSV = rgbToHsv(targetColor.r, targetColor.g, targetColor.b);
    
    // Başlangıç konumunu ayarla
    lastPos = { x: p.x, y: p.y };
    
    alert("Top Kilitlendi! 'Başlat'a basınca buradan itibaren takip edecek.");
    state = "READY_TO_TRACK";
    canvas.onmousedown = null;
    drawUI();
    updateButtons();
  };
}

// --- 3. TAKİP (TRACKING LOOP) ---
function runTracking(){
  if(state !== "READY_TO_TRACK"){ alert("Önce Hedef Seç!"); return; }
  
  state = "TRACKING";
  updateButtons();
  video.play();
  lastTime = video.currentTime;
  
  video.requestVideoFrameCallback(trackLoop);
}

function stopTracking(){
    state = "IDLE";
    video.pause();
    updateButtons();
}

function trackLoop(now, metadata){
  if(state !== "TRACKING") return;

  ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
  
  // ARAMA PENCERESİ (Window Search)
  // Tüm ekrana bakmıyoruz. Sadece lastPos etrafındaki kareye bakıyoruz.
  // Bu sayede yerdeki turuncu halka arama penceresinin dışındaysa ASLA algılanmaz.
  
  let win = searchWindow;
  let startX = Math.max(0, Math.floor(lastPos.x - win));
  let startY = Math.max(0, Math.floor(lastPos.y - win));
  let w = Math.min(canvas.width - startX, win * 2);
  let h = Math.min(canvas.height - startY, win * 2);

  // Görsel olarak arama penceresini çiz (Debug için iyi olur)
  ctx.strokeStyle = "rgba(0, 255, 255, 0.3)";
  ctx.strokeRect(startX, startY, w, h);

  let imgData = ctx.getImageData(startX, startY, w, h);
  let data = imgData.data;

  let totalX = 0, totalY = 0, count = 0;

  for(let y=0; y<h; y+=2){
    for(let x=0; x<w; x+=2){
      let i = (y * w + x) * 4;
      let r = data[i], g = data[i+1], b = data[i+2];

      // Renk Eşleşmesi
      if(isColorMatch(r, g, b)){
        totalX += (startX + x);
        totalY += (startY + y);
        count++;
      }
    }
  }

  if(count > 5){
    let curX = totalX / count;
    let curY = totalY / count;

    // Hız Hesapla
    let dt = metadata.mediaTime - lastTime;
    let dist = Math.hypot(curX - lastPos.x, curY - lastPos.y);

    if(dt > 0 && dist > 2){
       let speed = (dist * scale) / dt;
       
       // Filtrele: Çok yavaş veya saçma hızlıysa alma
       if(!locked && speed > 0.5 && speed < 25){
          if(captureFrames.length < 10){
              captureFrames.push(speed);
              // Ekrana anlık hızı yaz
              ctx.fillStyle = "yellow";
              ctx.font = "20px Arial";
              ctx.fillText(speed.toFixed(2) + " m/s", curX + 20, curY);
          } else if (!locked) {
              // 10 kare veri toplandıysa sonucu kilitle
              launchSpeed = captureFrames.reduce((a,b)=>a+b) / captureFrames.length;
              locked = true;
              showResults();
          }
       }
    }

    lastPos = { x: curX, y: curY }; // Konumu güncelle
    lastTime = metadata.mediaTime;

    // Hedefi çiz
    ctx.strokeStyle = "#00ff00";
    ctx.lineWidth = 3;
    ctx.beginPath(); ctx.arc(curX, curY, 20, 0, Math.PI*2); ctx.stroke();
  } else {
     // Top pencereden çıktıysa veya kaybolduysa pencereyi biraz büyüt ki geri bulabilsin
     searchWindow = Math.min(300, searchWindow + 5);
  }

  if(state === "TRACKING") video.requestVideoFrameCallback(trackLoop);
}

// --- RENK MANTIĞI ---
function isColorMatch(r, g, b){
    let hsv = rgbToHsv(r, g, b);
    let hDist = Math.abs(hsv.h - targetHSV.h);
    if(hDist > 180) hDist = 360 - hDist; // Dairesel fark

    // Toleranslar: Hue ±15, Saturation > 30, Value > 30
    // Ayrıca seçilen hedefin doygunluk seviyesine yakın olmalı
    return hDist < 15 && 
           hsv.s > (targetHSV.s - 40) && 
           hsv.v > (targetHSV.v - 40);
}

function rgbToHsv(r, g, b) {
    r/=255; g/=255; b/=255;
    let max = Math.max(r, g, b), min = Math.min(r, g, b);
    let h, s, v = max;
    let d = max - min;
    s = max === 0 ? 0 : d / max;
    if (max === min) h = 0;
    else {
        switch (max) {
            case r: h = (g - b) / d + (g < b ? 6 : 0); break;
            case g: h = (b - r) / d + 2; break;
            case b: h = (r - g) / d + 4; break;
        }
        h /= 6;
    }
    return { h: h * 360, s: s * 255, v: v * 255 };
}

// --- UI & YARDIMCILAR ---
function drawUI(){
  ctx.clearRect(0,0,canvas.width,canvas.height); // Önceki çizimleri sil
  // Eğer video duruyorsa (tracker çalışmıyorsa) videoyu canvasa bas
  if(state !== "TRACKING") ctx.drawImage(video, 0, 0, canvas.width, canvas.height);

  // Kalibrasyon noktaları
  ctx.fillStyle = "red";
  calibPoints.forEach(p => { ctx.beginPath(); ctx.arc(p.x, p.y, 5, 0, Math.PI*2); ctx.fill(); });
  
  // Hedef Noktası (varsa)
  if(lastPos && state === "READY_TO_TRACK"){
      ctx.strokeStyle = "lime";
      ctx.lineWidth = 3;
      ctx.beginPath(); ctx.arc(lastPos.x, lastPos.y, 25, 0, Math.PI*2); ctx.stroke();
      ctx.fillStyle = "white";
      ctx.fillText("HEDEF", lastPos.x - 20, lastPos.y - 30);
  }
}

function showResults(){
    stopTracking();
    let rpm = document.getElementById("rpm").value;
    let eff = (launchSpeed / (2*Math.PI*0.05*(rpm/60)))*100;
    
    document.getElementById("results").innerHTML = 
    `<h3>SONUÇ:</h3>
     Fırlatma Hızı: <b style="color:lime; font-size:20px">${launchSpeed.toFixed(2)} m/s</b><br>
     Verimlilik: <b>%${eff.toFixed(1)}</b>`;
}

function resetAll(){
    state = "IDLE";
    captureFrames = [];
    locked = false;
    lastPos = null;
    scale = 0;
    calibPoints = [];
    searchWindow = 100;
    updateButtons();
    document.getElementById("results").innerHTML = "Veri bekleniyor...";
    drawUI();
}

function updateButtons(){
    document.getElementById("btnCalib").className = state === "CALIBRATING" ? "active" : "";
    document.getElementById("btnTarget").className = state === "SELECTING_TARGET" ? "active" : "";
    document.getElementById("btnTrack").innerText = state === "TRACKING" ? "DURDUR" : "3. BAŞLAT";
}
</script>

</body>
</html>
