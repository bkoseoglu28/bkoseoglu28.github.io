<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Robot Shot Analyzer</title>
<style>
body { background:#111; color:white; font-family:Arial; text-align:center; }

.container{
  display:flex;
  justify-content:center;
  gap:20px;
  flex-wrap:wrap;
}

video, canvas{
  max-width:45vw;
  height:auto;
  border:1px solid white;
}

input{ width:70px; }
button{ margin:4px; padding:5px 10px; }
</style>
</head>
<body>

<h2>Robot Shot Analyzer</h2>

<input type="file" id="videoUpload" accept="video/*"><br><br>

Rod Length (m): <input type="number" id="rodLength" step="0.01" value="0.5">
Angle (deg): <input type="number" id="angle" step="1" value="45">
Wheel RPM: <input type="number" id="rpm" step="10" value="3000"><br><br>

<button onclick="grabFrame()">Select Frame</button>
<button onclick="calibrate()">Calibrate Rod</button>
<button onclick="toggleHSV()">HSV Pick</button>
<button onclick="toggleTracking()">Start / Stop Tracking</button>

<br><br>

<div class="container">
  <video id="video" controls></video>
  <canvas id="canvas"></canvas>
</div>

<h3 id="results">
Measured Speed: 0 m/s<br>
Wheel Surface Speed: 0 m/s<br>
Efficiency: 0 %<br><br>
Launch Angle: 0°<br>
Effective g: 9.81 m/s²<br>
Magnus: 0 m/s²<br>
Backspin Yok
</h3>

<script>
const video=document.getElementById("video");
const canvas=document.getElementById("canvas");
const ctx=canvas.getContext("2d");

let scale=1;
let tracking=false;
let lastPos=null;
let lastVideoTime=null;
let velocities=[];
let calibrationPoints=[];
let hsv={hMin:20,hMax:40,sMin:80,vMin:80};

document.getElementById("videoUpload").onchange=e=>{
  video.src=URL.createObjectURL(e.target.files[0]);
};

video.onloadedmetadata=()=>{
  canvas.width=video.videoWidth;
  canvas.height=video.videoHeight;
};

function grabFrame(){
  video.pause();
  ctx.drawImage(video,0,0,canvas.width,canvas.height);
}

function calibrate(){
  calibrationPoints=[];
  alert("Çubuğun iki ucuna tıkla");

  canvas.onclick=e=>{
    calibrationPoints.push({x:e.offsetX,y:e.offsetY});
    ctx.drawImage(video,0,0,canvas.width,canvas.height);

    ctx.fillStyle="red";
    ctx.beginPath();
    ctx.arc(e.offsetX,e.offsetY,6,0,Math.PI*2);
    ctx.fill();

    if(calibrationPoints.length==2){
      ctx.strokeStyle="red";
      ctx.lineWidth=3;
      ctx.beginPath();
      ctx.moveTo(calibrationPoints[0].x,calibrationPoints[0].y);
      ctx.lineTo(calibrationPoints[1].x,calibrationPoints[1].y);
      ctx.stroke();

      let rod=parseFloat(document.getElementById("rodLength").value);
      let dx=calibrationPoints[1].x-calibrationPoints[0].x;
      let dy=calibrationPoints[1].y-calibrationPoints[0].y;
      let pixelDist=Math.sqrt(dx*dx+dy*dy);
      scale=rod/pixelDist;

      canvas.onclick=null;
      alert("Kalibrasyon tamam ✅");
    }
  };
}

function toggleHSV(){
  alert("Topa tıkla");
  canvas.onclick=e=>{
    let data=ctx.getImageData(e.offsetX,e.offsetY,1,1).data;
    let h=rgbToHsv(data[0],data[1],data[2])[0];
    hsv.hMin=h-10;
    hsv.hMax=h+10;
    canvas.onclick=null;
    alert("HSV ayarlandı ✅");
  };
}

function toggleTracking(){
  tracking=!tracking;
  if(tracking){
    lastPos=null;
    lastVideoTime=null;
    velocities=[];
    video.play();
    requestAnimationFrame(processFrame);
  }
}

function processFrame(){
  if(!tracking) return;

  ctx.drawImage(video,0,0,canvas.width,canvas.height);

  let img=ctx.getImageData(0,0,canvas.width,canvas.height);
  let data=img.data;

  let sumX=0,sumY=0,count=0;

  for(let i=0;i<data.length;i+=4){
    let hsvVal=rgbToHsv(data[i],data[i+1],data[i+2]);
    if(hsvVal[0]>=hsv.hMin && hsvVal[0]<=hsv.hMax &&
       hsvVal[1]>hsv.sMin &&
       hsvVal[2]>hsv.vMin){
      let index=i/4;
      let x=index%canvas.width;
      let y=Math.floor(index/canvas.width);
      sumX+=x; sumY+=y; count++;
    }
  }

  if(count>150){
    let x=sumX/count;
    let y=sumY/count;

    if(lastPos!==null){
      let dx=(x-lastPos.x)*scale;
      let dy=(y-lastPos.y)*scale;
      let dt=video.currentTime-lastVideoTime;

      if(dt>0){
        let speed=Math.sqrt(dx*dx+dy*dy)/dt;
        if(speed>0.5) velocities.push(speed);
      }
    }

    lastPos={x,y};
    lastVideoTime=video.currentTime;

    ctx.strokeStyle="lime";
    ctx.lineWidth=3;
    ctx.beginPath();
    ctx.arc(x,y,10,0,Math.PI*2);
    ctx.stroke();
  }

  calculatePhysics();
  requestAnimationFrame(processFrame);
}

function calculatePhysics(){
  if(velocities.length<5) return;

  let measured=velocities.reduce((a,b)=>a+b)/velocities.length;

  let rpm=parseFloat(document.getElementById("rpm").value);
  let wheelRadius=0.05;
  let wheelSpeed=2*Math.PI*wheelRadius*(rpm/60);
  let efficiency=(measured/wheelSpeed)*100;

  let angleDeg=parseFloat(document.getElementById("angle").value);

  let g=9.81;
  let magnus=(rpm/60)*0.1;
  let effectiveG=g-magnus;

  document.getElementById("results").innerHTML=
  `Measured Speed: ${measured.toFixed(2)} m/s<br>
   Wheel Surface Speed: ${wheelSpeed.toFixed(2)} m/s<br>
   Efficiency: ${efficiency.toFixed(1)} %<br><br>
   Launch Angle: ${angleDeg}°<br>
   Effective g: ${effectiveG.toFixed(2)} m/s²<br>
   Magnus: ${magnus.toFixed(2)} m/s²<br>
   Backspin ${magnus>1?"Var 🌀":"Yok"}`;
}

function rgbToHsv(r,g,b){
  r/=255; g/=255; b/=255;
  let max=Math.max(r,g,b),min=Math.min(r,g,b);
  let h,s,v=max;
  let d=max-min;
  s=max==0?0:d/max;

  if(max==min){h=0;}
  else{
    switch(max){
      case r:h=(g-b)/d+(g<b?6:0);break;
      case g:h=(b-r)/d+2;break;
      case b:h=(r-g)/d+4;break;
    }
    h/=6;
  }
  return [h*360,s*255,v*255];
}
</script>

</body>
</html>
