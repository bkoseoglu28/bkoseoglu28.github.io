<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pro Video Fizik Analizatörü (Fixed)</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600&display=swap" rel="stylesheet">
    <script async src="https://docs.opencv.org/4.5.0/opencv.js" onload="onOpenCvReady();" type="text/javascript"></script>
    
    <style>
        body { font-family: 'Inter', sans-serif; background-color: #121212; color: #e0e0e0; }
        .card { background-color: #1e1e1e; border: 1px solid #333; }
        .canvas-container { position: relative; width: 100%; overflow: hidden; border: 2px solid #444; border-radius: 8px; }
        canvas { width: 100%; height: auto; display: block; cursor: crosshair; }
        .overlay-info { position: absolute; top: 10px; left: 10px; background: rgba(0,0,0,0.7); padding: 5px 10px; border-radius: 4px; pointer-events: none; }
        .btn-custom { background-color: #0d6efd; border: none; }
        .stat-box { background: #2c2c2c; padding: 10px; border-radius: 8px; margin-bottom: 8px; text-align: center; }
        .stat-value { font-size: 1.2rem; font-weight: bold; color: #4ade80; }
        .stat-label { font-size: 0.75rem; color: #aaa; }
        .text-info-custom { color: #0dcaf0; }
        #loading { position: fixed; top:0; left:0; width:100%; height:100%; background:rgba(0,0,0,0.9); z-index:9999; display:flex; justify-content:center; align-items:center; flex-direction:column; }
        /* Accordion Renk Ayarları */
        .accordion-button { background-color: #2c2c2c; color: white; }
        .accordion-button:not(.collapsed) { background-color: #0d6efd; color: white; }
        .accordion-button:focus { box-shadow: none; border-color: rgba(0,0,0,.125); }
    </style>
</head>
<body>

<div id="loading">
    <div class="spinner-border text-primary" role="status"></div>
    <div class="mt-3">Analiz Motoru Yükleniyor...</div>
</div>

<div class="container-fluid py-3">
    <div class="row">
        <div class="col-lg-8">
            <div class="card mb-3">
                <div class="card-header d-flex justify-content-between align-items-center">
                    <h5 class="mb-0">Video Sahnesi</h5>
                    <span class="badge bg-warning text-dark" id="modeStatus">Mod: Bekleniyor</span>
                </div>
                <div class="card-body p-0">
                    <div class="canvas-container" id="canvasWrapper">
                        <video id="videoInput" style="display:none;" muted></video>
                        <canvas id="canvasOutput"></canvas>
                        <div class="overlay-info" id="overlayInfo">Video Yükleyin</div>
                    </div>
                </div>
                <div class="card-footer">
                    <input type="range" class="form-range" id="videoSeek" value="0" min="0" max="100" step="0.1" disabled>
                    <div class="d-flex justify-content-center gap-2 mt-2">
                        <button class="btn btn-secondary btn-sm" id="prevFrame">< Frame Geri</button>
                        <button class="btn btn-primary btn-sm" id="playPause">Oynat / Durdur</button>
                        <button class="btn btn-secondary btn-sm" id="nextFrame">Frame İleri ></button>
                    </div>
                </div>
            </div>
            
            <div class="row">
                <div class="col-md-4">
                    <div class="stat-box border border-primary">
                        <div class="stat-value text-primary" id="valTotalSpeed">0.00</div>
                        <div class="stat-label">Toplam Hız ($V$)</div>
                    </div>
                </div>
                <div class="col-md-4">
                    <div class="stat-box">
                        <div class="stat-value text-info-custom" id="valVx">0.00</div>
                        <div class="stat-label">Yatay Hız ($V_x$)</div>
                        <small class="text-muted" style="font-size:0.6rem">Teorik (Açıya göre)</small>
                    </div>
                </div>
                <div class="col-md-4">
                    <div class="stat-box">
                        <div class="stat-value text-info-custom" id="valVy">0.00</div>
                        <div class="stat-label">Dikey Hız ($V_y$)</div>
                        <small class="text-muted" style="font-size:0.6rem">Teorik (Açıya göre)</small>
                    </div>
                </div>
            </div>
        </div>

        <div class="col-lg-4">
            <div class="accordion" id="accordionPanels">
                
                <div class="accordion-item bg-dark border-secondary">
                    <h2 class="accordion-header" id="headingOne">
                        <button class="accordion-button bg-secondary text-white" type="button" data-bs-toggle="collapse" data-bs-target="#panel1" aria-expanded="true" aria-controls="panel1">
                            1. Video Kaynağı
                        </button>
                    </h2>
                    <div id="panel1" class="accordion-collapse collapse show" aria-labelledby="headingOne" data-bs-parent="#accordionPanels">
                        <div class="accordion-body text-light">
                            <input type="file" class="form-control form-control-sm mb-2" id="fileInput" accept="video/*">
                        </div>
                    </div>
                </div>

                <div class="accordion-item bg-dark border-secondary">
                    <h2 class="accordion-header" id="headingTwo">
                        <button class="accordion-button collapsed bg-secondary text-white" type="button" data-bs-toggle="collapse" data-bs-target="#panel2" aria-expanded="false" aria-controls="panel2">
                            2. Kalibrasyon
                        </button>
                    </h2>
                    <div id="panel2" class="accordion-collapse collapse" aria-labelledby="headingTwo" data-bs-parent="#accordionPanels">
                        <div class="accordion-body text-light">
                            <div class="input-group mb-2">
                                <span class="input-group-text py-0">Referans (m)</span>
                                <input type="number" class="form-control" id="refLength" placeholder="1.50" step="0.01">
                            </div>
                            <button class="btn btn-outline-info w-100 btn-sm" id="btnCalibrate">Kalibrasyon Yap</button>
                            <div id="calibrationResult" class="mt-1 text-success small fw-bold text-center"></div>
                        </div>
                    </div>
                </div>

                <div class="accordion-item bg-dark border-secondary">
                    <h2 class="accordion-header" id="headingThree">
                        <button class="accordion-button collapsed bg-primary text-white" type="button" data-bs-toggle="collapse" data-bs-target="#panel3" aria-expanded="false" aria-controls="panel3">
                            3. Atış Açısı (Opsiyonel)
                        </button>
                    </h2>
                    <div id="panel3" class="accordion-collapse collapse" aria-labelledby="headingThree" data-bs-parent="#accordionPanels">
                        <div class="accordion-body text-light">
                            <p class="small text-muted mb-1">Yatay zemin 0°, Dikey yukarı 90° kabul edilir.</p>
                            <div class="input-group mb-2">
                                <span class="input-group-text py-0">Açı (°)</span>
                                <input type="number" class="form-control" id="inputAngle" placeholder="45" min="0" max="180">
                            </div>
                            <button class="btn btn-outline-warning w-100 btn-sm" id="btnSetAngle">Açıyı Görselleştir</button>
                            <div class="form-check mt-2">
                                <input class="form-check-input" type="checkbox" id="chkShowGuide" checked>
                                <label class="form-check-label small" for="chkShowGuide">Kılavuz Çizgisini Göster</label>
                            </div>
                        </div>
                    </div>
                </div>

                <div class="accordion-item bg-dark border-secondary">
                    <h2 class="accordion-header" id="headingFour">
                        <button class="accordion-button collapsed bg-secondary text-white" type="button" data-bs-toggle="collapse" data-bs-target="#panel4" aria-expanded="false" aria-controls="panel4">
                            4. Takip ve Analiz
                        </button>
                    </h2>
                    <div id="panel4" class="accordion-collapse collapse" aria-labelledby="headingFour" data-bs-parent="#accordionPanels">
                        <div class="accordion-body text-light">
                            <button class="btn btn-success w-100 mb-2 btn-sm" id="btnTrackSelect">Otomatik Takip (CamShift)</button>
                            <button class="btn btn-warning w-100 mb-2 btn-sm" id="btnManualTrack">Manuel Takip (Tıkla-İlerle)</button>
                            <button class="btn btn-danger w-100 btn-sm" id="btnReset">Sıfırla</button>
                        </div>
                    </div>
                </div>

            </div>

            <div class="row g-2 mt-2">
                <div class="col-6">
                    <div class="stat-box">
                        <div class="stat-value" id="valAccel">0.0</div>
                        <div class="stat-label">İvme (m/s²)</div>
                    </div>
                </div>
                <div class="col-6">
                    <div class="stat-box">
                        <div class="stat-value text-warning" id="valGravity">0.00</div>
                        <div class="stat-label">Gözlenen Yerçekimi</div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

<script>
let cvReady = false;
let video = document.getElementById('videoInput');
let canvas = document.getElementById('canvasOutput');
let ctx = canvas.getContext('2d');
let stream = null;
let isPlaying = false;
let currentMode = 'idle'; 
let pxPerMeter = 0;
let calibrationPoints = [];
let framesData = []; 

// Yeni Değişkenler
let launchAngleDeg = 0;
let launchOrigin = null; // {x, y}

// OpenCV Değişkenleri
let trackWindow = null;
let roiHist = null;
let hsv = null;
let dst = null;
let termCrit = null;

function onOpenCvReady() {
    cvReady = true;
    document.getElementById('loading').style.display = 'none';
    console.log('OpenCV.js Loaded');
}

// Dosya Yükleme
document.getElementById('fileInput').addEventListener('change', (e) => {
    let file = e.target.files[0];
    if(!file) return;
    video.src = URL.createObjectURL(file);
    video.onloadedmetadata = () => {
        canvas.width = video.videoWidth;
        canvas.height = video.videoHeight;
        video.currentTime = 0;
        document.getElementById('overlayInfo').innerText = `Video: ${video.videoWidth}x${video.videoHeight} | Süre: ${video.duration.toFixed(1)}s`;
        drawFrame();
    };
});

// Video Kontrolleri
document.getElementById('playPause').addEventListener('click', () => {
    if (isPlaying) { video.pause(); isPlaying = false; }
    else { video.play(); isPlaying = true; requestAnimationFrame(processVideo); }
});

document.getElementById('videoSeek').addEventListener('input', (e) => {
    video.currentTime = (video.duration * e.target.value) / 100;
    drawFrame();
});

document.getElementById('nextFrame').addEventListener('click', () => {
    video.currentTime += 1/30; 
    setTimeout(drawFrame, 100);
});
document.getElementById('prevFrame').addEventListener('click', () => {
    video.currentTime -= 1/30;
    setTimeout(drawFrame, 100);
});

// --- Mouse Etkileşimleri ---
canvas.addEventListener('mousedown', (e) => {
    const rect = canvas.getBoundingClientRect();
    const scaleX = canvas.width / rect.width;
    const scaleY = canvas.height / rect.height;
    const x = (e.clientX - rect.left) * scaleX;
    const y = (e.clientY - rect.top) * scaleY;

    if (currentMode === 'calibrating') {
        calibrationPoints.push({x, y});
        drawMarker(x, y, 'yellow');
        if (calibrationPoints.length === 2) {
            finishCalibration();
        }
    } else if (currentMode === 'settingAngle') {
        // Açı orijini belirleme
        launchOrigin = {x, y};
        document.getElementById('modeStatus').innerText = "Mod: Açı Merkezi Belirlendi";
        currentMode = 'idle';
        drawFrame();
    } else if (currentMode === 'selecting') {
        if (!trackWindow) {
            trackWindow = {x: x, y: y, width: 0, height: 0};
        } else {
            trackWindow.width = x - trackWindow.x;
            trackWindow.height = y - trackWindow.y;
            startTracking();
        }
    } else if (currentMode === 'manual') {
        processPhysics(x, y, video.currentTime);
        drawMarker(x, y, 'red');
        video.currentTime += 1/30; 
        setTimeout(drawFrame, 100);
    }
});

function drawMarker(x, y, color) {
    ctx.fillStyle = color;
    ctx.beginPath();
    ctx.arc(x, y, 5, 0, 2 * Math.PI);
    ctx.fill();
}

// 1. Kalibrasyon
document.getElementById('btnCalibrate').addEventListener('click', () => {
    currentMode = 'calibrating';
    calibrationPoints = [];
    document.getElementById('modeStatus').innerText = "Mod: Kalibrasyon (Çubuğun iki ucuna tıkla)";
    video.pause(); isPlaying = false;
});

function finishCalibration() {
    let p1 = calibrationPoints[0];
    let p2 = calibrationPoints[1];
    let pixelDist = Math.sqrt(Math.pow(p2.x - p1.x, 2) + Math.pow(p2.y - p1.y, 2));
    let realLength = parseFloat(document.getElementById('refLength').value);
    
    if (!realLength) { alert("Uzunluk giriniz!"); return; }

    pxPerMeter = pixelDist / realLength;
    document.getElementById('calibrationResult').innerText = `1m = ${pxPerMeter.toFixed(1)}px`;
    currentMode = 'idle';
    document.getElementById('modeStatus').innerText = "Mod: Hazır";
    drawFrame();
}

// 2. Açı Ayarlama
document.getElementById('btnSetAngle').addEventListener('click', () => {
    let val = parseFloat(document.getElementById('inputAngle').value);
    if(isNaN(val)) { alert("Lütfen bir açı girin"); return; }
    
    launchAngleDeg = val;
    currentMode = 'settingAngle';
    document.getElementById('modeStatus').innerText = "Mod: Topun Çıkış Noktasına Tıkla";
    video.pause();
});

function drawAngleGuide() {
    if (!launchOrigin || !document.getElementById('chkShowGuide').checked) return;
    
    // Canvas'ta Y ekseni ters (aşağı doğru artar).
    // Standart fizik: 0 derece sağ, 90 derece yukarı.
    const length = 2000; // Uzun bir çizgi
    const rad = launchAngleDeg * (Math.PI / 180);
    
    const endX = launchOrigin.x + length * Math.cos(rad);
    const endY = launchOrigin.y - length * Math.sin(rad); // Y ekseni ters çevrimi
    
    ctx.save();
    ctx.beginPath();
    ctx.moveTo(launchOrigin.x, launchOrigin.y);
    ctx.lineTo(endX, endY);
    ctx.strokeStyle = 'rgba(13, 202, 240, 0.8)'; // Cyan renk
    ctx.lineWidth = 2;
    ctx.setLineDash([5, 5]); // Kesikli çizgi
    ctx.stroke();
    
    ctx.fillStyle = 'rgba(13, 202, 240, 1)';
    ctx.font = "16px Arial";
    ctx.fillText(launchAngleDeg + "°", launchOrigin.x + 20, launchOrigin.y - 20);
    ctx.restore();
}

// 3. Takip
document.getElementById('btnTrackSelect').addEventListener('click', () => {
    if(pxPerMeter === 0) { alert("Önce kalibrasyon!"); return; }
    currentMode = 'selecting';
    trackWindow = null;
    document.getElementById('modeStatus').innerText = "Mod: Objeyi Seç (Sol-Üst -> Sağ-Alt)";
    video.pause();
});

document.getElementById('btnManualTrack').addEventListener('click', () => {
    if(pxPerMeter === 0) { alert("Önce kalibrasyon!"); return; }
    currentMode = 'manual';
    document.getElementById('modeStatus').innerText = "Mod: Manuel Takip";
    video.pause();
    framesData = [];
});

function startTracking() {
    // OpenCV Setup
    let src = cv.imread(canvas);
    hsv = new cv.Mat();
    cv.cvtColor(src, hsv, cv.COLOR_RGBA2RGB);
    cv.cvtColor(hsv, hsv, cv.COLOR_RGB2HSV);
    
    let roi = hsv.roi(new cv.Rect(trackWindow.x, trackWindow.y, trackWindow.width, trackWindow.height));
    roiHist = new cv.Mat();
    let mask = new cv.Mat();
    let channels = [0]; 
    let histSize = [180];
    let ranges = [0, 180];
    
    cv.calcHist([roi], channels, mask, roiHist, histSize, ranges);
    cv.normalize(roiHist, roiHist, 0, 255, cv.NORM_MINMAX);
    
    roi.delete(); mask.delete(); src.delete();
    termCrit = new cv.TermCriteria(cv.TERM_CRITERIA_EPS | cv.TERM_CRITERIA_COUNT, 10, 1);
    
    currentMode = 'tracking';
    video.play();
    isPlaying = true;
    requestAnimationFrame(processVideo);
}

function processVideo() {
    if (!isPlaying && currentMode !== 'tracking') return;
    if (video.paused || video.ended) { isPlaying = false; return; }

    drawFrame(); 

    if (currentMode === 'tracking') {
        let src = cv.imread(canvas);
        let hsvCanvas = new cv.Mat();
        cv.cvtColor(src, hsvCanvas, cv.COLOR_RGBA2RGB);
        cv.cvtColor(hsvCanvas, hsvCanvas, cv.COLOR_RGB2HSV);
        
        dst = new cv.Mat();
        let channels = [0]; let ranges = [0, 180];
        cv.calcBackProject([hsvCanvas], channels, roiHist, dst, ranges, 1);
        
        let [rotatedRect, trackBox] = cv.CamShift(dst, trackWindow, termCrit);
        
        trackWindow.x = trackBox.x;
        trackWindow.y = trackBox.y;
        trackWindow.width = trackBox.width;
        trackWindow.height = trackBox.height;

        let centerX = trackWindow.x + trackWindow.width / 2;
        let centerY = trackWindow.y + trackWindow.height / 2;
        
        // Takip karesini çiz
        let pts = cv.rotatedRectPoints(rotatedRect);
        ctx.strokeStyle = 'red'; ctx.lineWidth = 2;
        ctx.beginPath();
        ctx.moveTo(pts[0].x, pts[0].y);
        ctx.lineTo(pts[1].x, pts[1].y);
        ctx.lineTo(pts[2].x, pts[2].y);
        ctx.lineTo(pts[3].x, pts[3].y);
        ctx.closePath(); ctx.stroke();

        processPhysics(centerX, centerY, video.currentTime);
        src.delete(); hsvCanvas.delete(); dst.delete();
        requestAnimationFrame(processVideo);
    }
    document.getElementById('videoSeek').value = (video.currentTime / video.duration) * 100;
}

function drawFrame() {
    ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
    
    // Kalibrasyon çizgisi varsa
    if (calibrationPoints.length === 2) {
        ctx.strokeStyle = 'yellow'; ctx.lineWidth = 3;
        ctx.beginPath();
        ctx.moveTo(calibrationPoints[0].x, calibrationPoints[0].y);
        ctx.lineTo(calibrationPoints[1].x, calibrationPoints[1].y);
        ctx.stroke();
    }
    
    // Açı çizgisi varsa
    drawAngleGuide();
}

function processPhysics(x, y, time) {
    framesData.push({ t: time, x: x, y: y });
    if (framesData.length < 2) return;

    let prev = framesData[framesData.length - 2];
    let curr = framesData[framesData.length - 1];
    let dt = curr.t - prev.t;
    if (dt <= 0) return;

    let dist_px = Math.sqrt(Math.pow(curr.x - prev.x, 2) + Math.pow(curr.y - prev.y, 2));
    let speed = (dist_px / pxPerMeter) / dt; // m/s
    
    document.getElementById('valTotalSpeed').innerText = speed.toFixed(2);
    
    // Hız Bileşenleri Hesaplama
    if (launchAngleDeg > 0) {
        let rad = launchAngleDeg * (Math.PI / 180);
        let vx = speed * Math.cos(rad);
        let vy = speed * Math.sin(rad);
        
        document.getElementById('valVx').innerText = vx.toFixed(2);
        document.getElementById('valVy').innerText = vy.toFixed(2);
    }

    if (framesData.length > 2) {
        let prev2 = framesData[framesData.length - 3];
        let v1 = (Math.sqrt(Math.pow(prev.x - prev2.x, 2) + Math.pow(prev.y - prev2.y, 2)) / pxPerMeter) / (prev.t - prev2.t);
        let accel = (speed - v1) / dt;
        document.getElementById('valAccel').innerText = accel.toFixed(2);

        let vy_curr = ((curr.y - prev.y) / pxPerMeter) / dt;
        let vy_prev = ((prev.y - prev2.y) / pxPerMeter) / (prev.t - prev2.t);
        let ay = (vy_curr - vy_prev) / dt; 
        document.getElementById('valGravity').innerText = Math.abs(ay).toFixed(2);
    }
}

document.getElementById('btnReset').addEventListener('click', () => {
    framesData = [];
    currentMode = 'idle';
    launchOrigin = null; 
    document.getElementById('modeStatus').innerText = "Sıfırlandı";
    drawFrame();
});

</script>
</body>
</html>
